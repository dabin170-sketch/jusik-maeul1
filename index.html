<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>주식마을: 동물들의 월스트리트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* =========================================================
   🎨 화면 꾸미기(CSS) — 색을 바꾸고 싶으면 :root 의 값을 바꾸세요
   ========================================================= */
:root{
  --ui:1;
  --ink:#4a3c32; --ink2:#85725f; --card:#fffaf1; --line:#ecdfc9;
  --up:#1f8f55; --down:#d14343; --flat:#8a8a8a; --warn:#c97c12;
  --accent:#f0a35e; --mint:#7cc4a8; --sky:#d8eefc;
  --shadow:0 6px 18px rgba(90,60,30,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#a9dcae;color:var(--ink);
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit;color:var(--ink)}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none;font-size:calc(14px*var(--ui))}
#ui>*{pointer-events:auto}
#ui>#prompt,#ui>#toasts,#ui>#fade{pointer-events:none}
.hidden{display:none!important}
.jua{font-family:'Jua',sans-serif}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)} .warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:.85em}
b{font-weight:700}

/* ---------- HUD ---------- */
#hudL{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;max-width:270px}
.hud-box{padding:9px 13px}
.hud-date{font-family:'Jua';font-size:1.02em}
.hud-time{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:1.4em;font-family:'Jua'}
.chip{font-size:.6em;padding:3px 8px;border-radius:999px;background:#eee;color:#666;font-family:'Gowun Dodum';font-weight:700}
.chip.open{background:#d9f3e3;color:#1d7a49}.chip.pre{background:#fff0d6;color:#a8650e}.chip.closed{background:#ececf3;color:#6b6b80}
.hud-speed{display:flex;gap:4px;margin-top:6px}
.hud-speed button{border:none;background:#f3eadb;border-radius:8px;padding:3px 10px;font-size:.9em}
.hud-speed button.on{background:var(--accent);color:#fff}
#questBox{font-size:.88em;line-height:1.45}
#questBox .qt{font-family:'Jua';color:#b06a2a;margin-bottom:2px}
#hudR{position:absolute;right:12px;top:12px;padding:9px 13px;text-align:right;min-width:200px}
#hudR .tot{font-family:'Jua';font-size:1.25em}
.hud-btns{display:flex;gap:5px;margin-top:7px;justify-content:flex-end;flex-wrap:wrap}
.hbtn{border:none;background:#f3eadb;border-radius:10px;padding:5px 9px;font-size:.88em;font-weight:700}
.hbtn:hover{background:#ffe2c2}
#ticker{position:absolute;left:50%;transform:translateX(-50%);top:12px;display:flex;gap:6px;padding:6px 10px;
  max-width:calc(100vw - 560px);overflow:hidden;white-space:nowrap;font-size:.8em}
.tk{padding:2px 8px;border-radius:999px;background:#fff6e8}
#minimap{position:absolute;right:12px;bottom:12px;width:200px;height:144px;border-radius:14px;border:3px solid #fff;
  box-shadow:var(--shadow);background:#bfe5bf;cursor:pointer}
#prompt{position:absolute;transform:translate(-50%,-100%);background:#fff;padding:6px 12px;border-radius:12px;
  box-shadow:var(--shadow);font-weight:700;font-size:.9em;white-space:nowrap}
#prompt kbd{background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;font-family:'Jua'}
#toasts{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(640px,92vw)}
.toast{background:rgba(255,250,241,.97);border:2px solid var(--line);padding:8px 16px;border-radius:14px;box-shadow:var(--shadow);
  font-weight:700;animation:tin .3s ease;text-align:center}
#panel:not(.hidden) ~ #toasts{left:auto;right:16px;bottom:16px;transform:none;width:330px;align-items:flex-end}
#panel:not(.hidden) ~ #toasts .toast{font-size:.85em;padding:7px 12px}
.toast.news{border-color:#f0b68a}.toast.bad{border-color:#f2a3a3}.toast.good{border-color:#a8dcbc}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#fade{position:absolute;inset:0;background:#fff8ec;opacity:0;transition:opacity .22s}
#fade.on{opacity:1}

/* ---------- 대화창 ---------- */
#dialog{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(760px,94vw);display:flex;gap:14px;padding:14px;align-items:flex-start;cursor:pointer}
#dialog canvas{width:96px;height:96px;flex:none;background:#fff1dc;border-radius:16px}
.dname{font-family:'Jua';font-size:1.1em;color:#b06a2a}
.dtext{font-size:1.05em;line-height:1.65;min-height:3.3em}
.dnext{text-align:right;font-size:.8em;color:var(--ink2)}

/* ---------- 큰 패널(건물 안) ---------- */
#panel{position:absolute;inset:0;background:rgba(60,45,30,.35);display:flex;align-items:center;justify-content:center}
.pcard{width:min(1120px,96vw);height:min(780px,93vh);display:flex;flex-direction:column;overflow:hidden;background:var(--card);
  border-radius:24px;box-shadow:0 12px 40px rgba(60,40,20,.35);border:3px solid #fff;animation:pin .25s ease}
@keyframes pin{from{opacity:0;transform:scale(.97)}}
.phead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--theme,#7cb7a3);color:#fff}
.phead canvas{width:68px;height:68px;background:rgba(255,255,255,.35);border-radius:16px;flex:none}
.ptitle{font-family:'Jua';font-size:1.35em;white-space:nowrap}
.pbubble{flex:1;background:#fff;color:var(--ink);border-radius:14px;padding:8px 12px;font-size:.92em;line-height:1.5}
.pbubble b{color:#b06a2a}
.pclose{border:none;background:rgba(255,255,255,.9);border-radius:12px;padding:8px 13px;font-weight:700;font-size:1em;flex:none}
.ptabs{display:flex;gap:6px;padding:8px 14px;border-bottom:2px solid var(--line);overflow-x:auto;background:#fff6e8;flex:none}
.ptabs button{border:none;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--ink2);white-space:nowrap}
.ptabs button.on{background:var(--theme,#7cb7a3);color:#fff}
.pbody{flex:1;overflow:auto;padding:14px 16px}
.sec{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.sec h3{margin:0 0 8px;font-family:'Jua';font-weight:400;font-size:1.12em;color:#8a5a2e}
.sec h4{margin:10px 0 4px;font-size:1em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:#fffaf1;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.kpi .k{font-size:.8em;color:var(--ink2)} .kpi .v{font-family:'Jua';font-size:1.18em}
table.tbl{width:100%;border-collapse:collapse;font-size:.92em}
.tbl th{font-size:.82em;color:var(--ink2);text-align:right;padding:6px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:7px 6px;border-bottom:1px dashed var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.btn{border:none;border-radius:14px;padding:10px 18px;font-weight:700;font-size:1em;background:#f3eadb;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.btn:hover{filter:brightness(1.04)}
.btn.primary{background:var(--accent);color:#fff}
.btn.green{background:#3ea56d;color:#fff} .btn.red{background:#d9534f;color:#fff}
.btn.sm{padding:6px 11px;font-size:.88em;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;font-size:.75em;padding:2px 8px;border-radius:999px;background:#f3eadb;color:#7a5b3c;font-weight:700;margin-right:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.note{background:#fff5e2;border-left:4px solid var(--accent);padding:8px 12px;border-radius:8px;font-size:.9em;line-height:1.55;margin:8px 0}
.note.warnbox{background:#fff0e6;border-color:#e2843a}
.note.okbox{background:#eaf7ef;border-color:#3ea56d}

/* 시세·주문 */
.trade{display:grid;grid-template-columns:290px 1fr;gap:14px}
.srow{display:flex;align-items:center;gap:6px;width:100%;border:2px solid transparent;background:#fff;border-radius:14px;padding:9px 10px;margin-bottom:6px;text-align:left}
.srow.on{border-color:var(--accent);background:#fff6ea}
.srow .nm{flex:1;line-height:1.25}.srow .nm small{color:var(--ink2);font-size:.78em;display:block}
.srow .px{text-align:right;line-height:1.25;font-variant-numeric:tabular-nums}
.chartbox{position:relative;width:100%;height:280px}
.chartbox canvas{width:100%;height:100%;display:block}
.seg{display:inline-flex;background:#f3eadb;border-radius:12px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;border-radius:9px;padding:6px 14px;font-weight:700}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.buy{background:#3ea56d;color:#fff}.seg button.on.sell{background:#d9534f;color:#fff}
.order{display:flex;flex-direction:column;gap:9px}
.qty{display:flex;gap:4px;align-items:center}
.qty input,.order input[type=number]{width:120px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;font-size:1em;text-align:right}
.omsg{font-size:.9em;min-height:1.2em;font-weight:700}
.alloc{display:flex;height:22px;border-radius:999px;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.alloc div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.82em;margin-top:6px}

/* 뉴스 */
.news{border:2px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:10px;background:#fff}
.news .nt{font-family:'Jua';font-size:1.08em;margin:4px 0}
.news .nb{line-height:1.55;font-size:.93em}
.news .meta{font-size:.78em;color:var(--ink2)}
.news .react{margin-top:6px;font-size:.88em;background:#f7f2ea;border-radius:10px;padding:6px 10px}
.news .learn{margin-top:6px;font-size:.86em;color:#5d6f5a;background:#eef7ea;border-radius:10px;padding:6px 10px;line-height:1.5}

/* 학교 */
.lesson{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px}
.lesson .ln{width:38px;height:38px;border-radius:12px;background:#efe2fb;color:#7a58a3;display:flex;align-items:center;justify-content:center;font-family:'Jua';font-size:1.1em;flex:none}
.lesson.done .ln{background:#d9f3e3;color:#1d7a49}
.lesson.locked{opacity:.6}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;margin-bottom:7px;font-size:.98em;line-height:1.45}
.opt.sel{border-color:#9c7cc8;background:#f6effd}
.opt.ok{border-color:#3ea56d;background:#eaf7ef}.opt.no{border-color:#e08a8a;background:#fdf0f0}
.opt .why{display:block;font-size:.88em;color:var(--ink2);margin-top:4px}

/* 타이틀·생성 화면 */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,248,236,.2)}
.tcard{text-align:center;padding:30px 38px;background:rgba(255,250,241,.94);border-radius:30px;box-shadow:0 14px 40px rgba(80,50,20,.25);border:3px solid #fff;max-width:94vw}
.logo{font-family:'Jua';font-size:3.1em;color:#c76b2c;line-height:1.1;text-shadow:0 3px 0 #fff,0 6px 0 rgba(200,120,60,.2)}
.subt{color:#6d9a62;font-family:'Jua';letter-spacing:.25em;margin-top:6px}
.tbtns{display:flex;flex-direction:column;gap:9px;margin-top:22px;align-items:center}
.tbtns .btn{min-width:230px}
.swatches{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.field{padding:10px 14px;border:2px solid var(--line);border-radius:12px;font-size:1.05em;width:220px;text-align:center}
.letter{max-width:520px;text-align:left;line-height:1.8;font-size:1.04em;background:#fffdf6;border:2px dashed #e9cfa7;border-radius:18px;padding:18px 22px;margin:12px 0}

/* 메뉴 */
#mpNet{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#5a4036;color:#fff;padding:6px 14px;border-radius:999px;font-size:.85em;z-index:8;pointer-events:none}
#mpSide{position:absolute;right:10px;top:178px;width:230px;padding:8px 10px;font-size:.85em;max-height:40vh;overflow:auto}
.mpp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:3px 0}.mpp.off{opacity:.55}.mpp .dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid #fff;box-shadow:0 0 0 1px #c9b08a}
#mpBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:7px 10px;max-width:min(860px,94vw)}
#mpChat{position:absolute;left:10px;bottom:10px;width:min(330px,40vw);font-size:.82em}
#mpLog{max-height:150px;overflow:auto;background:rgba(255,250,240,.82);border-radius:10px;padding:6px 8px;margin-bottom:4px}
.mpl{margin:1px 0;word-break:break-all}.mpl.sys{color:#8a6a4a}
.mprow{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}#mpChatIn{flex:1;border:2px solid var(--line);border-radius:10px;padding:5px 8px;font:inherit;min-width:0}
.mpe{border:none;background:rgba(255,255,255,.9);border-radius:10px;font-size:1.2em;padding:2px 5px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}.mpe:hover{transform:translateY(-2px)}
body.mp-panel #mpSide, body.mp-panel #mpBar, body.mp-panel #mpChat{display:none}
#mpCard{position:absolute;inset:0;background:rgba(30,25,20,.5);display:flex;align-items:center;justify-content:center;z-index:6}
.mpform{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;text-align:left;max-width:460px;margin:10px auto;align-items:center}.mpform select,.mpform input{border:2px solid var(--line);border-radius:10px;padding:5px 8px;font:inherit}
.mpcode{font-family:Jua;font-size:1.6em;letter-spacing:3px;color:#c76b2c;background:#fff3dc;border-radius:10px;padding:2px 12px}
.mpslots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.mpslot{background:#fffaf0;border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:.85em}.mpslot.off{opacity:.55}.mpslot.empty{border-style:dashed;color:#a9927a}
.mpslot canvas{width:64px;height:64px}
@media (max-width:760px){ #mpSide{top:auto;bottom:120px;width:180px} #mpChat{width:52vw} .mpslots{grid-template-columns:repeat(2,1fr)} }
#psyCard{position:absolute;inset:0;background:rgba(30,25,20,.5);display:flex;align-items:center;justify-content:center;z-index:5}
#presCast{position:absolute;inset:0;background:rgba(30,25,20,.55);display:flex;align-items:center;justify-content:center;z-index:5}
.pccard{width:min(760px,94vw);max-height:94vh;overflow:auto;padding:14px}
#pcCanvas{width:100%;border-radius:12px;display:block;margin:8px 0;background:#fff3d6}
.pchead{font-family:Jua;color:#8a5a2e}.pctitle{font-family:Jua;font-size:1.2em;margin:4px 0}.pcquote{font-family:Jua;color:#8a5a2e;margin:4px 0 6px}
#menu{position:absolute;inset:0;background:rgba(60,45,30,.35);display:flex;align-items:center;justify-content:center}
#menu .tcard{min-width:320px}

/* 터치 조작 */
#touch{position:absolute;left:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
#touch button,#touchE{border:none;border-radius:14px;background:rgba(255,250,241,.85);font-size:1.3em;box-shadow:var(--shadow)}
#touchE{position:absolute;right:20px;bottom:170px;width:66px;height:66px;border-radius:50%;font-family:'Jua';font-size:1.4em;background:var(--accent);color:#fff}

@media (max-width:860px){
  .trade{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  #ticker{display:none}
}
@media (max-width:720px){
  .pcard{width:100vw;height:100vh;border-radius:0}
  .phead{padding:8px 10px;gap:8px}
  .phead canvas{width:46px;height:46px}
  .ptitle{font-size:1.05em}
  .pbubble{font-size:.8em}
  #ui{font-size:calc(12.5px*var(--ui))}
  #minimap{width:120px;height:86px}
  #hudR{min-width:0;max-width:49vw;padding:7px 9px}
  #hudR .tot{font-size:1.05em}
  .hbtn{padding:4px 6px;font-size:.8em}
  #hudL{max-width:47vw;gap:6px}
  .hud-box{padding:7px 9px}
  .hud-time{font-size:1.1em;flex-wrap:wrap}
  #questBox{font-size:.8em}
  #dialog canvas{width:64px;height:64px}
  #touchE{bottom:110px}
  .logo{font-size:2.2em}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <!-- HUD -->
  <div id="hudL" class="hidden">
    <div class="card hud-box">
      <div class="hud-date" id="hDate"></div>
      <div class="small" id="hLife" style="margin:2px 0 4px"></div>
      <div class="hud-time"><span id="hTime"></span><span id="hMkt" class="chip"></span></div>
      <div class="hud-speed" id="hSpeed">
        <button data-act="speed" data-arg="0" title="멈춤 (P)">⏸</button>
        <button data-act="speed" data-arg="1" title="보통 속도">▶</button>
        <button data-act="speed" data-arg="3" title="3배 빠르게">⏩</button>
      </div>
    </div>
    <div class="card hud-box" id="questBox"></div>
  </div>
  <div id="ticker" class="card hidden"></div>
  <div id="hudR" class="card hidden">
    <div class="small muted">총자산 (원화 기준)</div>
    <div class="tot num" id="hTotal"></div>
    <div class="small num" id="hToday"></div>
    <div class="hud-btns">
      <button class="hbtn" data-act="openDex">🏢 도감</button>
      <button class="hbtn" data-act="openMyPf">📈 내 자산</button>
      <button class="hbtn" data-act="openNews">📰 뉴스</button>
      <button class="hbtn" data-act="openMap">🗺️ 지도</button>
      <button class="hbtn" data-act="menu">☰</button>
    </div>
  </div>
  <canvas id="minimap" class="hidden" width="200" height="144" data-act="openMap"></canvas>
  <div id="prompt" class="hidden"></div>
  <div id="touch" class="hidden">
    <span></span><button data-key="ArrowUp">▲</button><span></span>
    <button data-key="ArrowLeft">◀</button><span></span><button data-key="ArrowRight">▶</button>
    <span></span><button data-key="ArrowDown">▼</button><span></span>
  </div>
  <button id="touchE" class="hidden" data-act="touchE">E</button>

  <div id="dialog" class="card hidden" data-act="dlgNext">
    <canvas id="dlgPortrait" width="192" height="192"></canvas>
    <div style="flex:1">
      <div class="dname" id="dlgName"></div>
      <div class="dtext" id="dlgText"></div>
      <div class="dnext">E / 스페이스 / 클릭 ▶</div>
    </div>
  </div>

  <div id="panel" class="hidden">
    <div class="pcard" id="pcard">
      <div class="phead">
        <canvas id="pPortrait" width="136" height="136"></canvas>
        <div class="ptitle" id="pTitle"></div>
        <div class="pbubble" id="pBubble"></div>
        <button class="pclose" data-act="closePanel">✕ 나가기</button>
      </div>
      <div class="ptabs" id="pTabs"></div>
      <div class="pbody" id="pBody"></div>
    </div>
  </div>

/* ============================== 4. 시간·날짜 ============================== */
const quarterOf = day => Q_OFFSET + Math.floor((day-1)/DAYS_PER_Q);
const qLabel = qn => `${Math.floor(qn/4)+1}년차 ${SEASONS[((qn%4)+4)%4]}`;
const seasonIdx = () => S ? quarterOf(S.clock.day)%4 : 0;
function dateLabel(day){ if(day<1) return '게임 시작 전'; const q=quarterOf(day); return `${Math.floor(q/4)+1}년차 ${SEASONS[q%4]} ${(day-1)%DAYS_PER_Q+1}일`; }
function timeLabel(min){ min=Math.floor(min); return `${String(Math.floor(min/60)%24).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`; }
function isOpen(){ return !!(S && S.dayData && S.dayData.k>=0 && S.dayData.k<TICKS); }
function mktStatus(){
  if(!S) return ['pre','장 시작 전'];
  if(isOpen()) return ['open','장중'];
  if(S.dayData && S.dayData.k>=TICKS) return ['closed','장 마감'];
  return ['pre','장 시작 전'];
}

/* ============================== 5. 게임 상태 만들기 ============================== */
let S = null;       // 저장되는 모든 게임 상태
let SILENT = false; // 검증 테스트 중에는 알림·저장을 끕니다
const co = id => S.cos[id];

function newState(name, color, scarf, seed, opt={}){
  RNG.s = seed>>>0;
  const s = {
    v:VERSION, seed:seed>>>0, createdAt:Date.now(),
    player:{name, color, scarf, x:31.5*T, y:26.8*T, dir:'down'},
    clock:{day:1, min:DAY_START},
    eco:{rate:4.0, rateExp:4.0, infl:2.8, growth:2.0, unemp:4.2, lnOil:Math.log(78), geo:0.12, trade:0.15, sent:0.1, nextCB:10, lnFx:Math.log(FX_START)},
    ecoHist:[], cos:{}, ix:{}, etf:{},
    pf:{krw:START_CASH, usd:0, usdAvgFx:0, base:START_CASH, hold:{}, realizedUsd:0, realizedKrw:0, fxRealized:0, fxFee:0, divUsd:0, divKrw:0, resets:0, valHist:[]},
    fx:FX_START, fxRef:FX_START, fxHist:[],
    orders:[], trades:[], news:[], ids:{order:1, news:1, trade:1},
    lessons:{}, quests:{}, badges:{}, flags:{}, diary:'', diaryLog:[], walked:0,
    settings:{speed:1, ui:1, sound:true, presLevel:'normal', psyPop:true}, dayData:null, rng:0, savedAt:0,
    pres:newPres(), home:newHome(), life:newLife(),
    level:'real', scen:opt.scen||null, mkt:newMkt(), psy:null, journal:[], rivals:null, pfHist:[]
  };
  S = s;
  let cap0=0;
  for(const d of COMPANY_DEFS){
    const cap=d.price*d.shares; cap0+=cap;
    // 최근 4분기 순이익 합으로 시작 PER(per0)이 나오도록 마지막 분기 매출을 역산
    const gsum = 1 + 1/(1+d.g) + 1/Math.pow(1+d.g,2) + 1/Math.pow(1+d.g,3);
    const lastRev = d.qRev || cap/d.per0/d.margin/gsum;
    const revs=[]; let rev=lastRev;
    for(let i=6;i>=0;i--){ revs[i]=rev; rev = rev/(1+d.g+RNG.normal()*d.gVol*0.35); }
    const fin=[];
    for(let i=0;i<=6;i++){
      const m = i===6 ? d.margin : d.margin + RNG.normal()*0.01;
      const r=revs[i], net=r*m, op=r*(m+(m>0?0.05:0.03));
      fin.push({qn:i, rev:r, op, net, eps:net/d.shares, mg:m, expRev:r/(1+RNG.normal()*0.02), expEps:net/d.shares/(1+RNG.normal()*0.03),
        yoy: i>=4 ? r/revs[i-4]-1 : null, guide:null, react:null});
    }
    // 게임 시작 전 60일 가격 기록 (차트용)
    const xs=[1]; for(let k=1;k<60;k++) xs.push(xs[k-1]*Math.exp(RNG.normal()*d.vol*0.85+0.0003));
    const sc=d.price/xs[59]; const hist=[]; let prev=xs[0]*sc*Math.exp(-RNG.normal()*d.vol);
    for(let k=0;k<60;k++){
      const c=xs[k]*sc, o=prev*Math.exp(RNG.normal()*d.vol*0.3);
      const h=Math.max(o,c)*Math.exp(Math.abs(RNG.normal())*d.vol*0.35), l=Math.min(o,c)*Math.exp(-Math.abs(RNG.normal())*d.vol*0.35);
      hist.push({d:k-59, o, h, l, c, v:Math.round(d.shares*d.tov*(0.6+0.8*RNG.next()))}); prev=c;
    }
    s.cos[d.id] = {
      price:d.price, prevClose:d.price, open:d.price, high:d.price, low:d.price, vol:0, lastRet:0,
      hist, fin, gExp:d.g, mNow:d.margin, hype:0, nextEarn:d.firstEarn,
      exp:{rev:lastRev*(1+d.g), eps:lastRev*(1+d.g)*d.margin/d.shares}, exp0:lastRev*(1+d.g),
      cash:cap*d.cashR, debt:cap*d.debtR, newsDays:[], earnDays:[]
    };
  }
  // 지수 5종: 게임 시작일(0일) = 1000
  for(const x of INDEX_DEFS){
    const st={hist:[], ref:1000, base:0};
    if(x.w==='cap'){ st.base=x.members.reduce((a,m)=>a+DEF[m].price*DEF[m].shares,0);
      for(let k=0;k<60;k++){ let sm=0; for(const m of x.members) sm+=s.cos[m].hist[k].c*DEF[m].shares; st.hist.push({d:k-59, v:1000*sm/st.base}); } }
    else { const vs=[1]; for(let k=1;k<60;k++){ let r=0; for(const m of x.members) r+=s.cos[m].hist[k].c/s.cos[m].hist[k-1].c-1; vs.push(vs[k-1]*(1+r/x.members.length)); }
      for(let k=0;k<60;k++) st.hist.push({d:k-59, v:1000*vs[k]/vs[59]}); }
    s.ix[x.id]=st;
  }
  // ETF 5종
  for(const e of ETF_DEFS){
    s.etf[e.id]={fee:1, dists:[], nextDist:18};
    const ih=s.ix[e.idx].hist, hist=[]; let prev=e.base*ih[0].v/1000;
    for(const p of ih){ const c=e.base*p.v/1000, o=prev; hist.push({d:p.d, o, h:Math.max(o,c)*1.002, l:Math.min(o,c)*0.998, c, v:300000}); prev=c; }
    s.cos[e.id]={price:e.base, prevClose:e.base, open:e.base, high:e.base, low:e.base, vol:0, lastRet:0, hist, fin:[], hype:0, newsDays:[], earnDays:[]};
  }
  s.pf.valHist.push({d:0, v:START_CASH, idx:1000, fx:FX_START});
  if(s.scen) scenInit(s);
  { const xs=[0]; for(let k=1;k<60;k++) xs.push(xs[k-1]+RNG.normal()*0.004); for(let k=0;k<60;k++) s.fxHist.push({d:k-59, v:FX_START*Math.exp(xs[k]-xs[59])}); }
  startDay(true);
  s.rng = RNG.s;
  return s;
}

/* ============================== 6. 시장 엔진 ============================== */
function marketCap(id){ return isEtf(id)?0:co(id).price*DEF[id].shares; }
function ttmEps(id){ const f=co(id).fin.slice(-4); return f.reduce((a,x)=>a+x.net,0)/DEF[id].shares; }
function perOf(id){ const e=ttmEps(id); return e>0 ? co(id).price/e : null; }
const r4 = v => Math.round(v*1e4)/1e4;
/* 지수 계산 */
function ixWeights(id){ const x=IX[id]; if(x.w==='equal') return x.members.map(m=>[m,1/x.members.length]);
  const caps=x.members.map(m=>co(m).price*DEF[m].shares), t=caps.reduce((a,b)=>a+b,0); return x.members.map((m,i)=>[m,caps[i]/t]); }
function ixLive(id){ const x=IX[id], st=S.ix[id];
  if(x.w==='cap'){ let sm=0; for(const m of x.members) sm+=co(m).price*DEF[m].shares; return 1000*sm/st.base; }
  let r=0; for(const m of x.members) r+=co(m).price/co(m).prevClose-1; return st.hist[st.hist.length-1].v*(1+r/x.members.length); }
function ixLast(id){ const h=S.ix[id].hist; return h[h.length-1].v; }
function ixChg(id){ return ixLive(id)/(S.ix[id].ref||ixLast(id))-1; }
function ixRet(id,n){ const h=S.ix[id].hist, k=Math.min(n,h.length-1); return h[h.length-1].v/h[h.length-1-k].v-1; }
/* ETF 계산 */
function etfPrice(id){ const e=DEF[id]; return e.base*ixLive(e.idx)/1000*S.etf[id].fee; }
function etfYield(id){ return ixWeights(DEF[id].idx).reduce((a,[m,w])=>a+w*DEF[m].div/co(m).price,0); }
function indexValue(){ return ixLive('D500'); }
function lastIdx(){ return ixLast('D500'); }
function dayChg(id){ const c=co(id); return c.price/(c.refClose||c.prevClose)-1; }
function idxChg(){ return ixChg('D500'); }
function lastIdxRet(){ const h=S.ix.D500.hist; return h.length>1 ? h[h.length-1].v/h[h.length-2].v-1 : 0; }
function oilPrice(){ return Math.exp(S.eco.lnOil); }
/* 교육용 단순 기초가치 — 예상 매출·이익률·금리로 계산한 「참고용 가격」.
   실제 주가는 이 값과 크게 달라질 수 있어요. */
function fairPrice(id){
  const c=co(id), d=DEF[id];
  const revF=c.exp.rev/c.exp0;
  const mF = d.margin>0 ? clamp(c.mNow/d.margin,0.6,1.4) : 1;
  const rF = Math.exp(d.rateS*(S.eco.rate-4.0));
  const gF = clamp(1+(c.gExp-d.g)*3, 0.6, 1.5);
  return d.price*revF*mF*rF*gF;
}
function regimeLabel(){
  const h=S.ix.D500.hist, n=h.length; const r20 = n>20 ? h[n-1].v/h[n-21].v-1 : 0;
  const mk = r20>0.05?'강세장':r20<-0.05?'약세장':'횡보장';
  const g=S.eco.growth; const ec = g<0?'경기침체':g<1.0?'경기 둔화':g>2.4?'경기 확장':'완만한 성장';
  return {mk, ec, r20};
}

function ecoSnap(e,c){ return {fxv:Math.exp(e.lnFx+c.fx), oil:Math.exp(e.lnOil), infl:e.infl, growth:e.growth, geo:e.geo, trade:e.trade, rateExp:e.rateExp+c.rateShock, sent:c.dSent}; }
function ecoDiffText(a,b){
  const out=[];
  const oc=b.oil/a.oil-1; if(Math.abs(oc)>0.005) out.push(`유가 ${oc>0?'▲':'▼'} ${Math.abs(oc*100).toFixed(1)}%`);
  const xc=b.fxv/a.fxv-1; if(Math.abs(xc)>0.002) out.push(`원/달러 환율 ${xc>0?'▲':'▼'} ${Math.abs(xc*100).toFixed(1)}%`);
  const ic=b.infl-a.infl; if(Math.abs(ic)>0.02) out.push(`물가 상승률 ${ic>0?'▲':'▼'} ${Math.abs(ic).toFixed(2)}%p`);
  const gc=b.growth-a.growth; if(Math.abs(gc)>0.02) out.push(`성장률 전망 ${gc>0?'▲':'▼'} ${Math.abs(gc).toFixed(2)}%p`);
  const rc=b.rateExp-a.rateExp; if(Math.abs(rc)>0.02) out.push(`금리 기대 ${rc>0?'▲ 인상 쪽':'▼ 인하 쪽'}`);
  if(b.geo-a.geo>0.05) out.push('지정학 위험 ▲'); else if(a.geo-b.geo>0.05) out.push('지정학 위험 ▼');
  if(b.trade-a.trade>0.05) out.push('무역 불확실성 ▲'); else if(a.trade-b.trade>0.05) out.push('무역 불확실성 ▼');
  const sc=b.sent-a.sent; if(Math.abs(sc)>0.04) out.push(`투자 심리 ${sc>0?'▲ 개선':'▼ 위축'}`);
  return out.length?out.join(' · '):'경제 변수 변화 작음';
}
function pickMacro(){
  const pool=MACRO_EVENTS.filter(ev=>!ev.cond||ev.cond(S.eco));
  const tot=pool.reduce((a,x)=>a+x.w,0); let r=RNG.next()*tot;
  for(const ev of pool){ r-=ev.w; if(r<=0) return ev; } return pool[pool.length-1];
}
function pushNews(n){
  n.id=S.ids.news++; n.day=S.clock.day; n.min=n.min||DAY_START; n.reaction=null;
  n.cids=n.cids||[]; n.groups=n.groups||[];
  S.news.push(n);
  for(const id of n.cids){ const c=co(id); if(!c.newsDays.includes(n.day)) c.newsDays.push(n.day); }
  if(S.news.length>500) S.news.splice(0,S.news.length-500);
  return n;
}

/* 하루 시작(06:00) — 오늘의 경제·뉴스·실적·주가 경로를 미리 계산해 둡니다(미래 주가는 화면에 공개하지 않아요). */
function startDay(isFirst){
  if(!isFirst) S.clock.day++;
  S.clock.min = DAY_START;
  const day=S.clock.day, e=S.eco;
  const ctx={dSent:0, rateShock:0, fx:0, group:Object.fromEntries(Object.keys(GROUP_NAME).map(k=>[k,0])), co:{}, gap:{}};
  const oil0=e.lnOil, trade0=e.trade, growth0=e.growth, geo0=e.geo, fx0=e.lnFx;
  // ① 경제 변수의 자연스러운 변화
  e.lnOil += 0.04*(Math.log(78)-e.lnOil) + 0.012*RNG.normal();
  e.growth += 0.02*(2.0-e.growth) + 0.04*RNG.normal();
  e.geo *= 0.94; e.trade *= 0.96;
  ctx.dSent += -0.04*e.sent + 0.03*RNG.normal();
  const todays=[];
  // ② 경제 이벤트 (가끔 두 개가 겹치기도 해요)
  const nEv = isFirst ? 0 : (RNG.chance(0.33) ? (RNG.chance(0.12)?2:1) : 0);
  const used=new Set();
  for(let i=0;i<nEv;i++){
    const ev=pickMacro(); if(used.has(ev.id)) continue; used.add(ev.id);
    const before=ecoSnap(e,ctx); const g0={...ctx.group};
    ev.apply(e,ctx);
    const after=ecoSnap(e,ctx);
    const groups=Object.keys(ctx.group).filter(k=>Math.abs(ctx.group[k]-g0[k])>0.001);
    todays.push({type:ev.type, sev:ev.sev, title:ev.title, body:ev.body, learn:ev.learn, ecoText:ecoDiffText(before,after), groups, evId:ev.id, min:7*60, cids:ev.cids||[]});
  }
  // ②-1 🐿️ 도람쥐 대통령 발표 (장 시작 전 또는 장중 긴급 발표)
  const intra = isFirst ? null : presRoll(ctx,todays);
  // ②-2 📉 보이지 않는 시장 국면·과열(버블)·시나리오 위기
  const MK = mktPre(ctx,todays,isFirst);
  // 사건으로 바뀐 금리 기대를 반영
  e.rateExp = clamp(e.rateExp + ctx.rateShock, 0.25, 9);
  // ③ 중앙은행 금리 결정 (20일마다)
  if(day===e.nextCB){ cbMeeting(ctx,todays); e.nextCB+=20; }
  // ④ 물가·실업률·금리 기대
  ctx.dlnOil = e.lnOil-oil0; ctx.dTrade = e.trade-trade0; ctx.dGrowth = e.growth-growth0;
  e.infl += 0.03*(2.6-e.infl) + 0.6*ctx.dlnOil + 0.02*RNG.normal();
  e.unemp += 0.05*((4.3-0.5*(e.growth-2))-e.unemp);
  const target=clamp(2.5+1.2*(e.infl-2.5)+0.3*(e.growth-2),1,7);
  const dre=0.02*(target-e.rateExp); e.rateExp+=dre; ctx.rateShock+=dre;   // 물가·성장에 따라 금리 기대가 천천히 움직임
  e.sent = clamp(e.sent+ctx.dSent,-1,1);
  // ⑤ 기업 뉴스
  const forced = isFirst ? RNG.pick(['HAMV','SOTR','RKCT']) : null;
  for(const id of IDS){
    if(id===forced || RNG.chance(0.015)) companyNewsEvent(id,ctx,todays);   // 42개 회사라 하루 평균 0.6건
  }
  // ⑥ 실적 발표 (장 시작 전 발표)
  for(const id of IDS){ if(co(id).nextEarn===day) doEarnings(id,ctx,todays); }
  // ⑥-0 기업의 장기 경쟁력 약화 · 파산 보호 신청
  if(!isFirst) mktCompanyEvents(ctx,todays);
  // ⑥-1 ETF: 매일 보수 차감, 분기마다 분배금
  for(const id of ETF_IDS){ const e=DEF[id], st=S.etf[id];
    st.fee*=1-e.er/250;
    if(day===st.nextDist){ st.nextDist+=DAYS_PER_Q;
      const y=etfYield(id), per=Math.round(etfPrice(id)*y/4*10000)/10000; st.dists.push({day, per, y});
      const h=S.pf.hold[id], amt=h?cents(h.qty*per):0;
      if(amt>0){ const pf=S.pf; pf.usdAvgFx=(pf.usd*pf.usdAvgFx+amt*S.fx)/(pf.usd+amt); pf.usd=cents(pf.usd+amt); pf.divUsd+=amt; pf.divKrw+=amt*S.fx;
        S.trades.push({id:S.ids.trade++, day, min:DAY_START, cid:id, side:'div', qty:h.qty, price:per, amount:amt, realized:null, via:'ETF 분배금'});
        if(!SILENT) toast(`💰 ${e.name} 분배금 ${usd(amt)}가 달러 예수금으로 들어왔어요`,'good'); } } }
  // ⑥-2 환율(원/달러): 시장이 겁을 먹으면(위험회피) 달러가 강해지고, 미국 금리 기대가 오르면 달러가 강해지는 경향 (늘 그렇지는 않아요)
  e.lnFx += 0.03*(Math.log(FX_START)-e.lnFx) - 0.03*ctx.dSent + 0.012*ctx.rateShock + 0.012*(e.geo-geo0) + ctx.fx + 0.0042*RNG.normal();
  const dlnFx=e.lnFx-fx0;
  // ⑦ 회사별 오늘 수익률 계산
  const volMul = (1 + 1.2*e.geo + 1.5*Math.max(0,-e.sent) + 0.5*e.trade)*MK.vol;   // 국면·난이도에 따른 흔들림 크기
  const m = 0.0002 + MK.mu + 0.0008*e.sent + 0.07*ctx.dSent + 0.006*volMul*RNG.normal();   // 시장 공통 변동
  const dd={k:-1, paths:{}, vols:{}, rets:{}, m};
  dd.fxPath=buildPath(Math.exp(fx0), dlnFx, dlnFx*0.4, 0.0035);   // 장중 환율 경로
  for(const id of IDS){
    const c=co(id), d=DEF[id];
    const macro = d.oilS*ctx.dlnOil + d.rateS*ctx.rateShock + d.cycS*ctx.dGrowth*0.03 + d.tradeS*ctx.dTrade*0.05 + d.geoS*(e.geo-geo0)*0.05
                + (ctx.group[d.group]||0)*(0.6+0.8*RNG.next()) + (MK.drift[d.group]||0);   // 업종 과열·붕괴
    const own = (ctx.co[id]||0) - (c.decl?0.0005*c.decl.k:0);   // 장기 경쟁력 약화는 매일 조금씩 반영                                  // 기업 뉴스 + 실적 반응
    const valuation = -0.006*Math.log(c.price/fairPrice(id))*(MK.valK[d.group]!=null?MK.valK[d.group]:1);   // 과열 땐 약해지고, 붕괴 땐 강해져요   // 기초가치 쪽으로 천천히 끌림
    const mom = 0.0012*c.hype;                                   // 투자 심리(쏠림)
    const idio = d.vol*Math.sqrt(volMul)*RNG.normal();           // 회사 고유의 확률적 변동
    let R = clamp(d.beta*m + macro + own + valuation + mom + idio, -0.35, 0.35);
    let gap = 0.75*own + 0.5*macro + 0.4*d.beta*0.07*ctx.dSent + d.vol*0.25*RNG.normal();
    if(ctx.crash && ctx.crash[id]!=null){ R=ctx.crash[id]; gap=Math.log(1+R)*0.85; }   // 파산 보호 신청일
    dd.rets[id]=R;
    dd.paths[id]=buildPath(Math.max(c.prevClose,1), Math.log(1+R), gap, d.vol);
    const base=d.shares*d.tov*(0.6+0.4*RNG.next())*(1+3*Math.abs(R)/d.vol);
    const ws=[]; let wsum=0; for(let k=0;k<=TICKS;k++){ const x=(k/TICKS-0.5)*2; const w=(1+1.5*x*x)*(0.6+0.8*RNG.next()); ws.push(w); wsum+=w; }
    dd.vols[id]=ws.map(w=>Math.round(base*w/wsum));
  }
  if(intra){ dd.intra=intra; applyIntraToPaths(dd); }
  S.dayData=dd;
  for(const id of TRADE_IDS) co(id).refClose=co(id).prevClose;   // 「오늘 등락」 기준 = 전일 종가
  for(const id of ETF_IDS) co(id).price=etfPrice(id);              // 보수 차감 반영
  S.fxRef=S.fx; for(const x of IX_IDS) S.ix[x].ref=ixLast(x); S.pf.valRef=totalAssets();
  for(const n of todays) pushNews(n);
  if(!SILENT && !isFirst){
    const big=todays.filter(n=>n.sev>=2||n.type==='실적');
    if(todays.length) toast(`📰 오늘 아침 뉴스 ${todays.length}건${big.length?' — '+big[0].title:''}`,'news'), Sound.news();
    for(const n of todays) if(n.type==='대통령') queueBroadcast(n.id);
    const F=festNow(); if(F) toast(`${F.e} 오늘은 「${F.name}」! 중앙광장에 무대와 부스가 열렸어요. 떨어진 도토리도 주워 보세요`,'good');
  }
}
function buildPath(p0,lnR,gap,vol){
  const N=TICKS, sd=vol/Math.sqrt(N)*0.9; const W=[0];
  for(let k=1;k<=N;k++) W[k]=W[k-1]+RNG.normal()*sd;
  const out=[];
  for(let k=0;k<=N;k++){ const t=k/N; out.push(Math.max(0.5, Math.exp(Math.log(p0)+gap+t*(lnR-gap)+(W[k]-t*W[N])))); }
  return out;
}
function cbMeeting(ctx,todays){
  const e=S.eco;
  const target=clamp(2.5+1.2*(e.infl-2.5)+0.3*(e.growth-2),1,7);
  const expMove=clamp(Math.round((e.rateExp-e.rate)/0.25)*0.25,-0.5,0.5);
  let act=clamp(Math.round((target-e.rate)/0.25)*0.25,-0.25,0.25);
  if(RNG.chance(0.2)) act+=RNG.pick([-0.25,0.25]);
  act=clamp(act,-0.5,0.5); if(e.rate+act<0.25) act=0;
  const surprise=act-expMove;
  e.rate=Math.round((e.rate+act)*100)/100; e.rateExp=e.rate;
  ctx.rateShock+=surprise; ctx.dSent-=surprise*0.3;
  const say=x=>x>0?`${x.toFixed(2)}%p 인상`:x<0?`${(-x).toFixed(2)}%p 인하`:'동결';
  const same=Math.abs(surprise)<0.01;
  todays.push({type:'금리', sev:same?1:2, min:7*60,
    title:`숲속 중앙은행, 기준금리 ${say(act)} → ${e.rate.toFixed(2)}%${same?'':' (예상 밖)'}`,
    body:`시장은 「${say(expMove)}」을 예상하고 있었어요. 실제 결정은 「${say(act)}」으로, ${same?'예상과 같았어요.':'예상과 달랐어요!'} 물가 상승률은 ${e.infl.toFixed(1)}% 수준이에요.`,
    learn: same ? '이미 예상된 금리 결정은 주가에 미리 반영되어 있어서 발표 당일 반응이 작은 경우가 많아요.'
                : '시장은 「결과」보다 「예상과의 차이」에 반응해요. 예상보다 높은 금리는 특히 성장주에 부담이 되는 경향이 있어요.',

}

function doEarnings(id,ctx,todays){
  const d=DEF[id], c=co(id), e=S.eco, fin=c.fin;
  const last=fin[fin.length-1], yearAgo=fin[fin.length-4];
  const qn=last.qn+1;
  const expRev=c.exp.rev, expEps=c.exp.eps;
  let g = c.gExp + d.gVol*RNG.normal() + 0.01*d.cycS*(e.growth-2);
  g=Math.max(g,-0.45);
  const dk=c.decl?c.decl.k:0; g-=0.03*dk;   // 장기 경쟁력 약화
  const rev=last.rev*(1+g);
  let m;
  if(d.group==='energy') m = d.margin*Math.pow(Math.exp(e.lnOil)/78,1.3) + RNG.normal()*0.01;
  else if(d.margin<0) m = clamp(c.mNow+0.012*Math.max(1,-d.margin)+RNG.normal()*0.03*Math.max(1,-d.margin),Math.min(-0.6,d.margin*1.6),0.2);
  else m = d.margin + (c.mNow-d.margin)*0.5 + RNG.normal()*0.012 + d.cycS*(e.growth-2)*0.004;
  m-=0.008*dk;
  const net=rev*m, op=rev*(m+(m>0?0.05:0.03)), eps=net/d.shares;
  const newG = clamp(c.gExp*0.5 + d.g*0.5 + RNG.normal()*d.gVol*0.6 + (g-c.gExp)*0.3 - 0.02*dk, -0.15, 0.4);
  const guideDelta=newG-c.gExp;
  const revS=rev/expRev-1;
  const epsS=clamp((eps-expEps)/Math.max(Math.abs(expEps),1e-9),-1,1);
  // ⭐ 주가 반응: 실적의 「크기」가 아니라 「기대와의 차이」+「앞으로의 전망」+「이미 높아진 기대(hype)」로 결정
  let re = d.earnS*(0.9*revS + 0.03*epsS + 1.6*guideDelta) - 0.035*Math.max(0,c.hype)*d.earnS + 0.02*Math.max(0,-c.hype) + RNG.normal()*0.015*d.earnS;
  re=clamp(re,-0.25,0.25);
  ctx.co[id]=(ctx.co[id]||0)+re;
  const yoy=rev/yearAgo.rev-1;
  fin.push({qn, rev, op, net, eps, mg:m, expRev, expEps, yoy, guide:newG, guideDelta, react:null, day:S.clock.day, revS, epsS});
  if(fin.length>16) fin.shift();
  c.gExp=newG; c.mNow=m;
  c.exp={rev:rev*(1+newG), eps:rev*(1+newG)*(d.margin<0?m+0.01:m)/d.shares};
  c.cash += net*0.5;
  c.hype=clamp(c.hype+re*4,-1,1);
  c.nextEarn += DAYS_PER_Q;
  c.earnDays.push(S.clock.day);
  declineOnEarnings(id,todays);
  // 배당 (분기마다 1/4씩)
  if(d.div>0){
    const per=d.div/4; c.cash-=per*d.shares;
    const h=S.pf.hold[id];
    if(h && h.qty>0){
      const amt=cents(h.qty*per), pf=S.pf; if(amt>0){
      pf.usdAvgFx=(pf.usd*pf.usdAvgFx+amt*S.fx)/(pf.usd+amt); pf.usd=cents(pf.usd+amt); pf.divUsd+=amt; pf.divKrw+=amt*S.fx;
      S.trades.push({id:S.ids.trade++, day:S.clock.day, min:DAY_START, cid:id, side:'div', qty:h.qty, price:per, amount:amt, realized:null, via:'배당'});
      if(!SILENT) toast(`💰 ${d.name} 배당금 ${usd(amt)} 달러 예수금으로 입금! (약 ${won(amt*S.fx)})`,'good'); }
    }
  }
  const verb = guideDelta>0.005?'높였어요':guideDelta<-0.005?'낮췄어요':'비슷하게 유지했어요';
  todays.push({type:'실적', sev:2, min:7*60+30, cids:[id], groups:[d.group], qn,
    title:`${d.name} ${qLabel(qn)} 분기 실적: 매출 ${bigUsd(rev)} (전년 대비 ${plainPct(yoy)})`,
    body:`시장 예상 매출은 ${bigUsd(expRev)}였고, 실제는 예상보다 ${revS>=0?'높았':'낮았'}어요(${plainPct(revS)}). 주당순이익(EPS)은 ${usd(eps)} (예상 ${usd(expEps)}). 회사는 다음 분기 매출 성장 전망을 ${verb} (분기 성장률 전망 ${plainPct(newG)}).`,
    learn:'주가는 실적의 절대 크기보다 「시장 예상과의 차이」, 「다음 분기 전망」, 「이미 얼마나 기대가 높았는지」에 더 크게 반응하는 경향이 있어요. 성장했는데 떨어질 수도, 적자인데 오를 수도 있어요.',
    ecoText:`매출 예상 대비 ${plainPct(revS)} · EPS 예상 대비 ${expEps!==0?plainPct((eps-expEps)/Math.abs(expEps)):'-'} · 전망 ${verb.replace('어요','음')}`});
}

function applyTick(k){
  const dd=S.dayData; dd.k=k;
  if(dd.intra && !dd.intra.done && k>=dd.intra.k) announceIntra(dd);
  for(const id of IDS){
    const c=co(id), p=dd.paths[id][k];
    if(k===0){ c.open=p; c.high=p; c.low=p; c.vol=0; }
    c.price=p; c.high=Math.max(c.high,p); c.low=Math.min(c.low,p); c.vol+=dd.vols[id][k];
  }
  for(const id of ETF_IDS){ const c=co(id), p=etfPrice(id);   // ETF는 담긴 회사들의 가격으로 계산
    if(k===0){ c.open=p; c.high=p; c.low=p; c.vol=0; }
    c.price=p; c.high=Math.max(c.high,p); c.low=Math.min(c.low,p); c.vol+=Math.round(20000*(1+Math.abs(p/c.prevClose-1)*40)); }
  S.fx=dd.fxPath[k];   // 장중 환율
  processOrders(k);
  if(k===0 && !SILENT){ toast('🔔 장이 열렸어요! (09:00)'); Sound.bell(); }
  uiDirty=true;
}

  // 👥 다른 투자자 → 💭 감정 관찰 → 📔 일기 결과 (모두 시장 가격을 「읽기만」 해요)

/* 시계를 앞으로 돌리며 10분 단위 가격·장 마감·새 날을 차례대로 처리 */
function advanceClock(mins){
  let remain=mins, guard=0;
  while(remain>1e-9 && guard++<2000){
    const dd=S.dayData, nextK=dd.k+1;
    const nb = nextK<=TICKS ? OPEN_MIN+nextK*TICK_MIN : DAY_END;
    const step=Math.max(0,nb-S.clock.min);
    if(step>remain){ S.clock.min+=remain; remain=0; break; }
    remain-=step; S.clock.min=nb;
    if(nextK<=TICKS){ applyTick(nextK); if(nextK===TICKS) closeMarket(); }
    else startDay(false);
  }
}
function sleepToMorning(){ advanceClock(DAY_END-S.clock.min); }

function orderReserve(o){ return o.side==='buy' ? (o.type==='limit' ? o.qty*o.limit : o.reserve) : 0; }
function availCash(){ return cents(S.pf.usd - S.orders.filter(o=>o.status==='open').reduce((a,o)=>a+orderReserve(o),0)); }   // 주문에 묶이지 않은 달러
function availShares(id){ const h=S.pf.hold[id]; const q=h?h.qty:0; return q - S.orders.filter(o=>o.status==='open'&&o.side==='sell'&&o.cid===id).reduce((a,o)=>a+o.qty,0); }
function stockValueUsd(){ let v=0; for(const id in S.pf.hold) v+=S.pf.hold[id].qty*co(id).price; return v; }
function stockValue(){ return stockValueUsd()*S.fx; }                              // 주식 평가금액(원화 환산)
function totalAssets(){ return S.pf.krw + S.pf.usd*S.fx + stockValue(); }         // 원화 기준 총자산
function unrealized(){ let v=0; for(const id in S.pf.hold){ const h=S.pf.hold[id]; v+=(co(id).price-h.avg)*h.qty; } return v; }  // 달러 기준 주가 평가손익
function fxChg(){ return S.fx/(S.fxRef||S.fx)-1; }
/* 원화 기준 손익을 「주가 때문」과 「환율 때문」으로 나누기
   · 주식마다 산 가격(달러)과, 그 달러를 바꿀 때의 평균 환율(avgFx)을 함께 기억해요.
   · 주가 손익 = 수량 × (현재가 − 평균단가) × 평균 환율
   · 환율 손익 = 수량 × 현재가 × (지금 환율 − 평균 환율)  (+ 달러 예수금, 원화로 되바꿀 때 확정된 몫)
   두 가지 + 배당을 더하면 「총자산 − 시작 원금」과 같아요(검증 테스트에서 확인). */
function pnlBreakdown(){
  const pf=S.pf, fx=S.fx; let stockKrw=0, stockFx=0;
  for(const id in pf.hold){ const h=pf.hold[id], p=co(id).price; stockKrw+=h.qty*(p-h.avg)*h.avgFx; stockFx+=h.qty*p*(fx-h.avgFx); }
  const cashFx = pf.usd>0 ? pf.usd*(fx-pf.usdAvgFx) : 0;
  return {stockUnreal:stockKrw, stockReal:pf.realizedKrw, stockFx, cashFx, fxReal:pf.fxRealized, div:pf.divKrw,
    priceTotal:stockKrw+pf.realizedKrw, fxTotal:stockFx+cashFx+pf.fxRealized, total:totalAssets()-pf.base};
}
/* 순수 계산 함수(검증 테스트에서도 사용) — 가격은 달러 */
function execBuyRaw(pf,id,qty,price){
  const cost=cents(qty*price); if(cost>pf.usd+1e-9) return false;
  const h=pf.hold[id]||(pf.hold[id]={qty:0,avg:0,avgFx:0});
  const oldUsd=h.avg*h.qty;
  h.avgFx=(h.avgFx*oldUsd + pf.usdAvgFx*cost)/(oldUsd+cost);   // 이 주식을 산 달러의 평균 환율
  h.avg=(oldUsd+cost)/(h.qty+qty); h.qty+=qty;
  pf.usd=cents(pf.usd-cost); return true;
}
function execSellRaw(pf,id,qty,price){
  const h=pf.hold[id]; if(!h||h.qty<qty) return null;
  const P=cents(qty*price), realized=P-h.avg*qty;
  pf.usdAvgFx=(pf.usd*pf.usdAvgFx + P*h.avgFx)/(pf.usd+P);      // 판 돈(달러)은 원래 환율 기록을 이어받아요
  pf.usd=cents(pf.usd+P); pf.realizedUsd+=realized; pf.realizedKrw+=realized*h.avgFx; h.qty-=qty;
  if(h.qty===0) delete pf.hold[id]; return realized;
}
/* 환전 — toUsd: 원화(amount원)→달러 / toKrw: 달러(amount달러)→원화.  mid = 기준 환율 */
function exchangeRaw(pf,dir,amount,mid,spread){
  if(dir==='toUsd'){
    const k=Math.floor(amount); if(!(k>0)||k>pf.krw) return null;
    const rate=mid*(1+spread), u=Math.floor(k/rate*100)/100; if(!(u>0)) return null;
    pf.usdAvgFx=(pf.usd*pf.usdAvgFx+k)/(pf.usd+u); pf.usd=cents(pf.usd+u); pf.krw-=k; pf.fxFee+=k-u*mid;
    return {krw:k, usd:u, rate};
  }
  const u=cents(amount); if(!(u>0)||u>pf.usd+1e-9) return null;
  const rate=mid*(1-spread), k=Math.floor(u*rate), realized=k-u*pf.usdAvgFx;   // 확정된 환차손익
  pf.fxRealized+=realized; pf.fxFee+=u*mid-k; pf.usd=cents(pf.usd-u); pf.krw+=k;
  return {krw:k, usd:u, rate, realized};
}
function doExchange(dir,amount){
  if(dir==='toKrw' && cents(amount)>availCash()+1e-9) return {ok:false,msg:`바꿀 수 있는 달러가 부족해요. (주문에 묶이지 않은 달러 ${usd(availCash())})`};
  if(dir==='toUsd' && Math.floor(amount)>S.pf.krw) return {ok:false,msg:`원화 예수금이 부족해요. (보유 ${won(S.pf.krw)})`};
  const r=exchangeRaw(S.pf,dir,amount,S.fx,FX_SPREAD);
  if(!r) return {ok:false,msg:'금액을 다시 확인해 주세요.'};
  S.trades.push({id:S.ids.trade++, day:S.clock.day, min:Math.floor(S.clock.min), cid:'FX', side:dir, qty:r.usd, price:r.rate, amount:r.krw, realized:r.realized==null?null:r.realized, via:'환전'});
  setQuest('exchange'); uiDirty=true;
  if(!SILENT){ Sound.coin(); toast(dir==='toUsd'?`💱 ${won(r.krw)} → ${usd(r.usd)} (적용 환율 ${fxTxt(r.rate)})`:`💱 ${usd(r.usd)} → ${won(r.krw)} (적용 환율 ${fxTxt(r.rate)})`,'good'); }
  return {ok:true,msg:dir==='toUsd'?`${won(r.krw)}을 ${usd(r.usd)}로 바꿨어요. 적용 환율 ${fxTxt(r.rate)} (기준 ${fxTxt(S.fx)} + 스프레드)`
                                    :`${usd(r.usd)}를 ${won(r.krw)}으로 바꿨어요. 이번 환전으로 확정된 환차손익: ${plainSignWon(r.realized)}`};
}
function fill(id,side,qty,price,via,why){
  if(!(qty>=1)) return false;
  price=cents(price);
  let realized=null;
  const h0=S.pf.hold[id], hc=co(id).hist, hn=hc.length, refC=k=>hc[Math.max(0,hn-1-k)].c;
  const cx={r5:price/refC(4)-1, r20:price/refC(19)-1, fairR:isEtf(id)?null:price/fairPrice(id), plBefore:h0?price/h0.avg-1:null};
  if(side==='buy'){ if(!execBuyRaw(S.pf,id,qty,price)) return false; }
  else { realized=execSellRaw(S.pf,id,qty,price); if(realized===null) return false; }
  { const h=S.pf.hold[id]; if(h&&h.since==null) h.since=S.clock.day; const tot=totalAssets(); cx.w=h?h.qty*co(id).price*S.fx/tot:0; cx.cashW=(S.pf.krw+S.pf.usd*S.fx)/tot; }
  S.trades.push({id:S.ids.trade++, day:S.clock.day, min:Math.floor(S.clock.min), cid:id, side, qty, price, amount:cents(qty*price), realized, via, why:why||null, ctx:cx});
  if(side==='buy'){ setQuest('firstBuy'); giveBadge('firstBuy'); }
  if(!SILENT){ toast(`✅ 체결: ${DEF[id].name} ${qty}주 ${side==='buy'?'매수':'매도'} @ ${usd(price)} (약 ${won(price*S.fx)})`, side==='buy'?'good':''); Sound.coin(); }
  uiDirty=true; return true;
}
function processOrders(k){
  for(const o of S.orders){
    if(o.status!=='open') continue;
    const p=co(o.cid).price;
    if(o.type==='market' && k===0){
      let q=o.qty;
      o.status='filled'; o.doneDay=S.clock.day;           // 예약금 먼저 풀기
      if(o.side==='buy'){ q=Math.min(q,Math.floor(availCash()/cents(p))); }
      else q=Math.min(q,availShares(o.cid));
      if(q>0){ fill(o.cid,o.side,q,p,'시장가(장 시작가)',o.why); o.filledQty=q; o.fillPrice=cents(p); if(q<o.qty) o.note='돈이 부족해 일부만 체결'; }
      else { o.status='canceled'; o.note='달러 예수금 부족으로 체결 실패'; }
    } else if(o.type==='limit'){
      const hit = o.side==='buy' ? p<=o.limit : p>=o.limit;
      if(hit){
        const fp = k===0 ? p : o.limit;   // 장 시작부터 조건 충족이면 시작가, 장중이면 지정한 가격
        o.status='filled'; o.doneDay=S.clock.day; o.filledQty=o.qty; o.fillPrice=cents(fp);
        if(!fill(o.cid,o.side,o.qty,fp,'지정가',o.why)){ o.status='canceled'; o.note='체결 실패'; }
      }
    }
  }
}
/* 주문 넣기 — 결과 메시지를 돌려줘요 */
function placeOrder(id,side,type,qty,limit,why){
  qty=Math.floor(qty);
  if(!(qty>=1)) return {ok:false,msg:'수량을 1주 이상 입력해 주세요.'};
  const c=co(id), p=c.price, open=isOpen();
  if(type==='limit'){
    limit=cents(limit);
    if(!(limit>0)) return {ok:false,msg:'지정가를 입력해 주세요.'};
    if(Math.abs(limit/p-1)>0.3) return {ok:false,msg:'지정가가 현재가와 30% 넘게 차이나요. 숫자를 다시 확인해 주세요.'};
  }
  const hint = S.pf.usd<=0 ? ' 먼저 「💱 환전」 탭에서 원화를 달러로 바꿔 주세요.' : '';
  const base = {id:S.ids.order, cid:id, side, type, qty, placedDay:S.clock.day, placedMin:Math.floor(S.clock.min), status:'open', why:why||null};
  if(side==='buy'){
    if(type==='market'){
      if(open){ const cost=cents(qty*cents(p)); if(cost>availCash()) return {ok:false,msg:`달러 예수금이 부족해요. (필요 ${usd(cost)}, 주문 가능 ${usd(availCash())})${hint}`}; fill(id,'buy',qty,p,'시장가',why); return {ok:true,msg:'시장가 매수가 바로 체결됐어요.'}; }
      const reserve=cents(qty*p*1.2);
      if(reserve>availCash()) return {ok:false,msg:`장이 닫혀 있어 다음 장 시작 가격 변동에 대비해 ${usd(reserve)}가 필요해요. (주문 가능 ${usd(availCash())})${hint}`};
      S.ids.order++; S.orders.push({...base, reserve});
      return {ok:true,msg:'장이 닫혀 있어서 다음 장 시작(09:00) 가격으로 체결될 예정이에요.'};
    }
    if(cents(qty*limit)>availCash()) return {ok:false,msg:`달러 예수금이 부족해요. (필요 ${usd(cents(qty*limit))})${hint}`};
    if(open && p<=limit){ fill(id,'buy',qty,p,'지정가(즉시)',why); return {ok:true,msg:'현재가가 지정가 이하라서 바로 체결됐어요.'}; }
    S.ids.order++; S.orders.push({...base, limit});
    return {ok:true,msg:`지정가 주문 접수! 가격이 ${usd(limit)} 이하로 내려와야 체결돼요. (5거래일 유효)`};
  } else {
    if(qty>availShares(id)) return {ok:false,msg:`팔 수 있는 주식이 부족해요. (매도 가능 ${availShares(id)}주)`};
    if(type==='market'){
      if(open){ fill(id,'sell',qty,p,'시장가',why); return {ok:true,msg:'시장가 매도가 바로 체결됐어요. 판 돈은 달러 예수금으로 들어와요.'}; }
      S.ids.order++; S.orders.push({...base});
      return {ok:true,msg:'다음 장 시작(09:00) 가격으로 매도될 예정이에요.'};
    }
    if(open && p>=limit){ fill(id,'sell',qty,p,'지정가(즉시)',why); return {ok:true,msg:'현재가가 지정가 이상이라서 바로 체결됐어요.'}; }
    S.ids.order++; S.orders.push({...base, limit});
    return {ok:true,msg:`지정가 매도 접수! 가격이 ${usd(limit)} 이상으로 올라와야 체결돼요.`};
  }
}

      {t:'회사가 내 주식 가격이 떨어지지 않게 지켜 줄 의무가 생긴다.',ok:false,why:'회사는 주가를 보장하지 않아요. 주가는 시장에서 사고파는 동물들이 정해요.'},
      {t:'햄비디아 제품을 싸게 살 수 있는 쿠폰이 생긴다.',ok:false,why:'주식은 할인 쿠폰이 아니에요.'}],
    explain:'주주는 회사가 벌어들인 이익에 대한 권리를 나눠 가져요. 회사가 이익의 일부를 현금으로 나눠 주면 그게 <b>배당</b>이에요. 하지만 회사가 어려워지면 주가가 크게 떨어질 수 있고, 투자한 돈을 잃을 수도 있어요. 주식은 <b>원금이 보장되지 않는 투자</b>예요.',
    practice:'기업 거리에서 다른 회사 건물에 들어가 「시가총액」을 확인해 보세요. 시가총액 = 주가 × 발행주식 수 예요.',
    review:'주식 = 회사 소유권의 작은 조각 · 시가총액 = 주가 × 발행주식 수 · 원금 보장 없음'}; } },
{ id:'L2', title:'시장가와 지정가', unlock:()=>!!S.quests.visitBroker, lock:'너굴증권을 한 번 방문하면 열려요.',
  build(){ return {
    exp:`너굴증권에서는 두 가지 방법으로 주문할 수 있어요. 지금 시장은 <b>${mktStatus()[1]}</b> 상태예요. 장은 매일 09:00에 열리고 15:30에 닫혀요.`,
    q:'현재가가 10,000원인 주식에 「9,500원 지정가 매수」 주문을 냈어요. 맞는 설명을 모두 고르세요.', multi:true,
    opts:[{t:'가격이 9,500원 이하로 내려와야 체결된다.',ok:true,why:'지정가 매수는 「이 가격 이하일 때만 사겠다」는 약속이에요.'},
      {t:'주문만 넣으면 오늘 반드시 체결된다.',ok:false,why:'가격 조건이 맞지 않으면 체결되지 않아요. 지정가는 체결을 보장하지 않아요.'},
      {t:'시장가 주문은 가격보다 「바로 체결되는 것」을 우선한다.',ok:true,why:'시장가는 지금 가격에 바로 사고팔지만, 예상보다 비싸게(싸게) 체결될 수도 있어요.'},
      {t:'장이 닫혀 있을 때 넣은 시장가 주문은 다음 장 시작 가격으로 체결될 수 있다.',ok:true,why:'장 시작 가격은 전날 종가와 다를 수 있어요(밤사이 뉴스 때문에!). 이 게임도 그렇게 작동해요.'}],
    explain:'<b>시장가</b> = 가격보다 체결 우선. <b>지정가</b> = 체결보다 가격 우선. 어떤 방식이 항상 더 좋은 건 아니에요. 급하게 사고팔아야 할 땐 시장가, 원하는 가격이 분명할 땐 지정가가 쓰여요.',
    practice:'너굴증권에서 현재가보다 조금 낮은 가격으로 지정가 매수를 넣어 보고, 「미체결 주문」 탭에서 체결되는지 지켜보세요.',
    review:'시장가 = 빠른 체결 · 지정가 = 원하는 가격 · 지정가는 체결 보장 없음'}; } },
{ id:'L3', title:'수익률과 평균 매입단가', unlock:()=>!!S.quests.firstBuy, lock:'주식을 처음 사 보면 열려요.',
  build(){
    const hid=Object.keys(S.pf.hold)[0];
    let name='예시 주식', avg=10, q=10, p=12, mine=false;
    if(hid){ const h=S.pf.hold[hid]; name=DEF[hid].name; avg=h.avg; q=h.qty; p=cents(co(hid).price); mine=true; }
    const pl=(p-avg)*q, r=p/avg-1;
    const opts=[
      {t:`평가손익 ${plainSignUsd(pl)}, 수익률 ${plainPct(r,2)}`,ok:true,why:`(현재가 − 평균 매입단가) × 수량 = (${usd(p)} − ${usd(avg)}) × ${q} = ${plainSignUsd(pl)}. 수익률 = ${usd(p)} ÷ ${usd(avg)} − 1 = ${plainPct(r,2)}.`},
      {t:`평가손익 ${plainSignUsd(p*q)}, 수익률 ${plainPct(p/avg,2)}`,ok:false,why:'앞의 숫자는 손익이 아니라 지금 주식 전체의 「평가금액」이에요. 수익률도 「− 1」을 빼먹었어요.'},
      {t:`평가손익 ${plainSignUsd(p-avg)}, 수익률 ${plainPct((p-avg)/p,2)}`,ok:false,why:'1주 기준 손익만 계산했고, 수익률 분모도 현재가로 잘못 나눴어요. 분모는 「산 가격」이에요.'},
      {t:`평가손익 ${plainSignUsd(pl)}, 수익률 ${plainPct((p-avg)/p,2)}`,ok:false,why:'손익은 맞지만 수익률은 「산 가격(평균 매입단가)」으로 나눠야 해요.'}];
    return {
      exp:mine?`지금 당신은 <b>${name}</b>를 평균 <b>${usd(avg)}</b>에 <b>${q}주</b> 가지고 있고, 현재가는 <b>${usd(p)}</b>예요.`:`예시: <b>${name}</b>를 1주 ${usd(avg)}에 ${q}주 샀고, 지금 가격은 ${usd(p)}예요.`,
      q:'아직 팔지 않았을 때의 평가손익과 수익률(달러 기준)로 맞는 것은?', multi:false, opts:opts.sort(()=>Math.random()-0.5),
      explain:'<b>평가손익</b>은 아직 팔지 않은 주식의 「종이 위」 손익이고, 팔면 <b>실현손익</b>이 돼요. 같은 주식을 여러 번 나눠 사면 <b>평균 매입단가</b>로 계산해요. 예) $10에 10주 + $12에 10주 → 평균 $11.<br>그런데 이 마을 주식은 <b>달러</b>로 거래돼요. 그래서 <b>원화로 따진 수익률</b>은 환율 변화까지 더해져서 달러 수익률과 달라질 수 있어요. (「환율과 환차손」 수업에서 자세히!)',
      practice:'「📈 내 자산」에서 같은 종목의 「주가 수익률(달러)」과 「원화 수익률」을 나란히 비교해 보세요.',
      review:'평가손익 = (현재가 − 평균단가) × 수량 · 수익률 = 현재가 ÷ 평균단가 − 1 · 달러 수익률 ≠ 원화 수익률'}; } },
{ id:'L4', title:'뉴스와 주가의 관계', unlock:()=>!!latestReactNews(), lock:'뉴스가 나온 날 장이 한 번 마감되면 열려요.', quest:'lessonNews',
  build(){
    const n=latestReactNews();
    const it=n.reaction.items[0], gr=n.reaction.groups[0];
    const r = it ? it.r : (gr?gr.r:0), who = it ? DEF[it.cid].name : `${GROUP_NAME[gr.g]} 업종`;
    const beta = it ? DEF[it.cid].beta : 1;
    const mkt=n.reaction.idx, own=r-beta*mkt;
    return {
      exp:`<b>${dateLabel(n.day)}</b> 아침 뉴스: 「${esc(n.title)}」<br>그날 장 마감 기준으로 <b>${who}</b>는 <b>${pctTxt(r)}</b>, 시장 전체(도토리 지수)는 <b>${pctTxt(mkt)}</b> 움직였어요.`,
      q:`이날 ${who}의 주가 움직임에 대해 맞는 설명을 모두 고르세요.`, multi:true,
      opts:[{t:'이날 주가 변화에는 이 뉴스 말고 시장 전체의 움직임도 섞여 있다.',ok:true,why:`맞아요. 그날 시장 전체가 ${pctTxt(mkt)} 움직였어요. 주가는 여러 이유가 합쳐진 결과예요.`},
        {t:'같은 종류의 뉴스가 다시 나오면 주가는 반드시 같은 방향으로 움직인다.',ok:false,why:'같은 뉴스라도 그때의 기대, 시장 분위기, 다른 뉴스에 따라 반응이 달라져요.'},
        {t:'뉴스 내용이 이미 예상되어 있었다면 반응이 작거나 오히려 반대일 수 있다.',ok:true,why:'시장은 「예상과의 차이」에 반응해요. 다들 알던 소식이면 이미 가격에 들어가 있을 수 있어요.'},
        {t:r>=0?'주가가 올랐으니 앞으로도 계속 오를 것이다.':'주가가 떨어졌으니 이 회사는 이제 망한 것이다.',ok:false,why:'하루의 움직임으로 회사의 미래를 단정할 수 없어요. 회사가 돈을 버는 구조가 바뀌었는지가 더 중요해요.'}],
      explain:`교육용으로 아주 단순하게 나눠 보면, 시장 민감도(베타) ${beta.toFixed(1)}인 ${who}가 시장 때문에 움직인 몫은 약 ${pctTxt(beta*mkt)}, 그 밖의 이유(뉴스·회사 고유 요인)로 움직인 몫은 약 <b>${pctTxt(own)}</b>예요. 뉴스는 주가를 움직이는 <b>여러 재료 중 하나</b>일 뿐, 정답표가 아니에요.`,
      practice:'뉴스 방송국 「뉴스 보관함」에서 다른 뉴스들의 「시장 반응」을 비교해 보세요. 비슷한 뉴스인데 반응이 다른 경우를 찾아보세요.',
      review:'주가 변화 = 시장 전체 + 업종 + 회사 고유 이유 · 같은 뉴스, 다른 반응 · 기대와의 차이가 중요'}; } },
{ id:'L5', title:'실적은 좋은데 왜 떨어졌지?', unlock:()=>!!lastEarnings(), lock:'어떤 회사든 실적을 한 번 발표하고 장이 마감되면 열려요.',
  build(){
    const le=lastEarnings(), d=DEF[le.id], f=le.f;
    return {
      exp:`최근 <b>${d.name}</b>가 실적을 발표했어요. 매출은 전년 대비 <b>${plainPct(f.yoy)}</b>, 시장 예상 대비 <b>${plainPct(f.revS)}</b>, 다음 분기 성장 전망은 <b>${f.guideDelta>0.005?'상향':f.guideDelta<-0.005?'하향':'유지'}</b>. 그날 주가는 <b>${pctTxt(f.react)}</b> 움직였어요.<br><span class="muted small">(교과서 예시: 햄비디아가 매출 30% 성장을 발표했는데 주가는 8% 하락했다면?)</span>`,
      q:'기업이 성장했는데도 주가가 떨어질 수 있는 이유로 가능한 것을 모두 고르세요.', multi:true,
      opts:[{t:'시장이 더 높은 성장률을 기대했다.',ok:true,why:'30% 성장해도 시장이 45%를 기대했다면 「실망」이에요.'},
        {t:'기업이 다음 분기 전망을 낮췄다.',ok:true,why:'주가는 과거보다 미래를 더 많이 반영해요. 전망 하향은 큰 악재가 될 수 있어요.'},
        {t:'국제 분쟁 등으로 시장 전체가 하락했다.',ok:true,why:'좋은 실적도 시장 전체가 겁먹은 날엔 함께 떨어질 수 있어요.'},
        {t:'매출이 늘어난 기업의 주가는 반드시 올라야 한다.',ok:false,why:'실적과 주가는 일대일로 움직이지 않아요. 이 게임도, 현실도 그래요.'}],
      explain:'주가에는 이미 「앞으로 이만큼 잘할 것」이라는 기대가 들어 있어요. 그래서 실적 발표 날에는 <b>예상과 실제의 차이</b>, <b>다음 전망의 변화</b>, 그리고 <b>그전까지 기대가 얼마나 높았는지</b>가 중요해요. 반대로 적자 회사라도 예상보다 손실이 작고 전망이 좋아지면 주가가 오를 수 있어요.',
      practice:`기업 거리의 ${d.name} 건물에 들어가 「실적 발표」 탭을 확인해 보세요. 예상치와 실제치를 직접 비교할 수 있어요.`,
      review:'실적 ≠ 주가 · 기대 대비 차이 · 미래 전망 · 시장 전체 분위기'}; } },
{ id:'L6', title:'환율과 환차손', unlock:()=>!!S.quests.exchange, lock:'너굴증권에서 원화를 달러로 한 번 환전하면 열려요.',
  build(){
    const pf=S.pf, fx=S.fx, b=pnlBreakdown();
    return {
      exp:`당신은 달러를 평균 <b>${fxTxt(pf.usdAvgFx)}</b>에 바꿨어요(스프레드 포함). 지금 기준 환율은 <b>${fxTxt(fx)}</b>이에요.<br>지금까지 원화 기준 손익 <b>${plainSignWon(b.total)}</b> 가운데 <b>주가 때문인 몫은 ${plainSignWon(b.priceTotal)}</b>, <b>환율 때문인 몫은 ${plainSignWon(b.fxTotal)}</b>이에요.`,
      q:'달러로 사는 주식(해외주식)과 환율에 대해 맞는 설명을 모두 고르세요.', multi:true,
      opts:[{t:'주가가 그대로여도 환율이 내려가면(원화 강세), 원화로 계산한 내 자산은 줄어든다.',ok:true,why:'맞아요. 같은 $100이라도 1,400원일 땐 14만 원, 1,300원일 땐 13만 원이에요. 이게 「환차손」이에요.'},
        {t:'원화를 달러로 바꿀 때는 기준 환율보다 조금 비싸게 사고, 되팔 때는 조금 싸게 판다.',ok:true,why:`「스프레드」 때문이에요. 이 게임에서는 ${(FX_SPREAD*100).toFixed(1)}%씩 붙어서, 바꿨다가 바로 되돌리면 약 ${(FX_SPREAD*200).toFixed(1)}% 손해예요.`},
        {t:'주가가 10% 오르면 원화로 계산한 수익도 반드시 10%다.',ok:false,why:'환율이 함께 변하면 달라져요. 주가 +10%, 환율 −10%면 원화로는 오히려 약 1% 손해예요.'},
        {t:'환율이 오르면(원화 약세) 달러 자산을 가진 사람의 원화 평가액에는 유리하게 작용할 수 있다.',ok:true,why:'맞아요. 이것이 「환차익」이에요. 다만 환율이 언제 오를지는 아무도 정확히 알 수 없어요.'}],
      explain:'원화로 본 해외주식 수익은 대략 <b>(주가 수익) + (환율 변화)</b>예요.<br>예) 환율 1,400원일 때 $1,000어치 주식을 샀어요(140만 원). 주가가 10% 올라 $1,100이 됐는데 환율이 1,260원으로 10% 내렸다면 → $1,100 × 1,260원 = <b>138만 6천 원</b>. 주가는 올랐는데 원화로는 1만 4천 원 손해예요!<br>환율은 경제 상황, 금리, 세계의 불안감 등으로 움직여요. 시장이 겁을 먹으면 달러가 강해지는 경우가 많지만, 늘 그런 건 아니에요.',
      practice:'「📈 내 자산」의 「원화 기준 손익 나눠 보기」에서 주가 몫과 환율 몫을 확인하고, 환전 탭에서 「살 때 환율」과 「팔 때 환율」을 비교해 보세요.',
      review:'원화 수익 ≈ 주가 수익 + 환율 변화 · 환율 ↓(원화 강세) → 환차손 · 환율 ↑(원화 약세) → 환차익 · 환전마다 스프레드 비용'}; } },
{ id:'L7', title:'ETF와 분산투자', unlock:()=>!!S.quests.firstBuy, lock:'주식을 처음 사 보면 열려요.',
  build(){
    const n=Math.min(20,S.ix.D500.hist.length-1), mem=IX.D500.members;
    const rets=mem.map(m=>{ const h=co(m).hist, k=Math.min(n,h.length-1); return [m,h[h.length-1].c/h[h.length-1-k].c-1]; }).sort((a,b)=>b[1]-a[1]);
    const ir=ixRet('D500',n), best=rets[0], worst=rets[rets.length-1];
    const eh=co('DOTO').hist, ek=Math.min(n,eh.length-1), etfR=eh[eh.length-1].c/eh[eh.length-1-ek].c-1;
    return {
      exp:`최근 ${n}거래일 동안 <b>도토리 500</b>은 ${pctTxt(ir)} 움직였어요. 같은 기간 36개 회사 중 가장 많이 오른 <b>${DEF[best[0]].name}</b>는 ${pctTxt(best[1])}, 가장 많이 내린 <b>${DEF[worst[0]].name}</b>는 ${pctTxt(worst[1])}였어요. 도토리 500을 따라가는 <b>도토리 500 ETF(DOTO)</b>는 ${pctTxt(etfR)} 움직였어요.`,
      q:'ETF와 분산투자에 대해 맞는 설명을 모두 고르세요.', multi:true,
      opts:[{t:'ETF 한 주를 사면 여러 회사에 조금씩 나눠 투자하는 효과가 있다.',ok:true,why:`맞아요. DOTO 한 주에는 ${mem.length}개 회사가 비중대로 담겨 있어요.`},
        {t:'ETF는 여러 회사를 담았으니 절대 손실이 나지 않는다.',ok:false,why:'시장 전체가 떨어지는 날엔 ETF도 함께 떨어져요. 분산은 「한 회사의 사고」 위험을 줄여 주지만 「시장 전체」 위험은 줄여 주지 못해요.'},
        {t:'ETF는 운용 보수가 있어서, 따라가는 지수보다 수익률이 아주 조금 낮아진다.',ok:true,why:`맞아요. DOTO의 총보수는 연 ${(DEF.DOTO.er*100).toFixed(2)}%예요. 작아 보여도 오래 쌓이면 차이가 나요.`},
        {t:'분산투자를 하면 가장 많이 오른 종목만큼 수익을 낼 수 있다.',ok:false,why:`분산하면 최고 종목(${pctTxt(best[1])})만큼 벌기는 어렵지만, 최악 종목(${pctTxt(worst[1])})만큼 잃을 위험도 줄어요.`}],
      explain:'<b>분산투자</b>는 「어느 회사가 잘될지 정확히 알 수 없다」는 사실을 인정하는 방법이에요. 여러 회사에 나눠 담으면 한 회사의 나쁜 소식이 전체에 주는 충격이 작아져요. 하지만 금리·경기·전쟁처럼 <b>모든 회사에 함께 영향을 주는 위험(시장 위험)</b>은 분산으로 없앨 수 없어요. 그리고 시가총액 가중 지수는 큰 회사 몇 곳에 생각보다 많이 쏠려 있을 수 있어요.',
      practice:'기업 도감 「지수」 탭에서 도토리 500과 튼튼방어 지수를 비교해 보고, 「ETF」 탭에서 담긴 회사와 비중을 확인해 보세요.',
      review:'ETF = 여러 회사를 담은 바구니 · 분산 = 개별 회사 위험 ↓ · 시장 위험은 남음 · 보수만큼 수익 ↓'}; } },
{ id:'L8', title:'정책 발표와 시장', unlock:()=>!!latestPresReact(), lock:'도람쥐 대통령의 발표가 나온 날 장이 한 번 마감되면 열려요.',
  build(){
    const n=latestPresReact(), day=n.day;
    const rOf=id=>{ const h=co(id).hist, i=h.findIndex(x=>x.d===day); return i>0?h[i].c/h[i-1].c-1:null; };
    const rs=IDS.map(id=>[id,rOf(id)]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
    const up=rs.filter(x=>x[1]>0).length, top=rs.slice(0,2), bot=rs.slice(-2).reverse();
    return {
      exp:`${dateLabel(day)}, 도람쥐 대통령이 발표했어요: <b>「${esc(n.title)}」</b><br>🔧 바뀐 경제 변수: ${esc(n.ecoText)}<br>그날 도토리 500은 <b>${pctTxt(n.reaction.idx)}</b>. 42개 회사 중 <b>${up}개는 오르고 ${rs.length-up}개는 내렸어요</b>. 가장 많이 오른 곳은 ${top.map(x=>`${DEF[x[0]].name}(${pctTxt(x[1])})`).join(', ')}, 가장 많이 내린 곳은 ${bot.map(x=>`${DEF[x[0]].name}(${pctTxt(x[1])})`).join(', ')}이에요.`,
      q:'정책 발표와 주가에 대해 맞는 설명을 모두 고르세요.', multi:true,
      opts:[{t:'정책 발표는 관세·물가·금리 기대·투자 심리 같은 경제 변수를 바꾸고, 그 변화가 회사마다 다르게 전해진다.',ok:true,why:'맞아요. 같은 발표라도 해외 의존도, 금리 민감도, 업종에 따라 영향이 달라요.'},
        {t:'대통령이 어떤 회사를 칭찬하면 그 회사 주가는 반드시 오른다.',ok:false,why:'발언만으로는 회사의 돈벌이가 바뀌지 않아요. 잠깐 움직였다가 되돌아가는 일도 많고, 다른 뉴스가 더 크게 작용할 수도 있어요.'},
        {t:'이미 시장이 예상하던 정책이라면 발표 당일 반응이 작을 수 있다.',ok:true,why:'맞아요. 주가는 「예상과의 차이」에 반응해요. 예상된 소식은 이미 가격에 상당 부분 들어가 있을 수 있어요.'},
        {t:'정책이 자주 바뀌는 것 자체도 불확실성을 키워 위험이 될 수 있다.',ok:true,why:'맞아요. 「인상 → 유예 → 재인상」처럼 오락가락하면 기업도 투자자도 계획을 세우기 어려워요.'},
        {t:'관세가 오르면 모든 회사의 주가가 똑같이 떨어진다.',ok:false,why:`그날만 봐도 ${up}개 회사는 올랐어요. 수입 부품 의존도가 낮은 국내 중심 회사는 덜 영향을 받거나 상대적으로 유리할 수도 있어요.`}],
      explain:'정책 → 경제 변수 → 업종·기업 → 주가. 이 순서를 기억하세요. 예를 들어 <b>관세 인상</b>은 수입 비용을 올려 일부 기업의 이익 전망을 낮추고, 물가와 금리 기대를 자극하며, 무역 불확실성을 키워요. 하지만 국내 생산 중심 기업은 덜 영향을 받거나 유리할 수도 있어요. 또 발표가 <b>얼마나 예상됐는지</b>, 발표 뒤 <b>정책이 바뀌는지</b>에 따라 반응은 매번 달라져요. 이 게임의 대통령과 정책은 모두 가상이며, 실제 인물·정책과 관계없어요.',
      practice:'도토리 대통령궁 「📋 정책 현황」에서 관세율 변화를 보고, 뉴스 방송국에서 대통령 발표가 있던 날 오른 업종과 내린 업종을 비교해 보세요.',
      review:'정책은 주가를 직접 정하지 않음 · 경제 변수를 바꿈 · 회사마다 민감도가 다름 · 예상된 발표는 반응이 작을 수 있음 · 잦은 번복 = 불확실성'}; } },
{ id:'L9', title:'손실 회피와 매몰비용', unlock:()=>S.trades.some(t=>t.side==='sell')||((S.psy&&S.psy.ev.length)||0)>0, lock:'주식을 한 번 팔아 보거나, 💭 마음 기록이 하나 생기면 열려요.',
  build(){
    const hs=Object.keys(S.pf.hold).map(i=>({i,r:co(i).price/S.pf.hold[i].avg-1})).sort((a,b)=>a.r-b.r), w=hs[0];
    const lossSell=S.trades.slice().reverse().find(t=>t.side==='sell'&&t.realized<0);
    const exp = w&&w.r<0 ? `지금 가진 <b>${DEF[w.i].name}</b>는 평균단가 ${usd(S.pf.hold[w.i].avg)}보다 <b>${pctTxt(w.r)}</b> 낮아요. 혹시 「평균단가까지만 돌아오면 팔아야지」라고 생각하고 있나요? 그 숫자는 <b>내가 산 가격</b>일 뿐, 시장은 그 숫자를 알지 못해요.`
      : lossSell ? `${dateLabel(lossSell.day)}에 <b>${DEF[lossSell.cid].name}</b>를 팔아 ${signUsdTxt(lossSell.realized)} 손실을 확정했어요. 지금 가격은 ${usd(co(lossSell.cid).price)}예요. 그때 팔기까지 마음이 어땠나요?`
      : '같은 10만 원이라도, 10만 원을 벌었을 때의 기쁨보다 10만 원을 잃었을 때의 고통이 훨씬 크게 느껴진 적이 있나요?';
    return { exp,
      q:'「매몰비용 오류」에서 벗어난 생각을 모두 고르세요.', multi:true,
      opts:[{t:'「평균단가까지만 오르면 팔겠다」고 정해 둔다.',ok:false,why:'평균단가는 내 사정일 뿐이에요. 회사의 가치나 앞으로의 전망과는 아무 관계가 없어요.'},
        {t:'「지금 이 가격에 이 회사를 처음 본다면 이만큼 살까?」라고 물어본다.',ok:true,why:'맞아요. 이미 쓴 돈이 아니라 앞으로의 판단에 집중하는 질문이에요.'},
        {t:'「이미 많이 잃었으니 끝까지 기다린다」고 결심한다.',ok:false,why:'잃은 돈은 기다린다고 돌아오지 않을 수 있어요. 기다릴 이유는 회사에 있어야 해요.'},
        {t:'산 이유와 비교해 회사의 실적·전망이 어떻게 바뀌었는지 확인한다.',ok:true,why:'맞아요. 판단의 기준은 「산 가격」이 아니라 「산 이유가 아직 유효한가」예요.'},
        {t:'손실 난 종목을 더 사서 평단가를 낮추면 위험도 함께 줄어든다.',ok:false,why:'평단가는 내려가도 한 종목에 걸린 돈은 커져요. 회사가 계속 나빠지면 손실도 더 커질 수 있어요.'}],
      explain:'<b>손실 회피 편향</b>: 여러 연구에서 사람들은 같은 크기의 이익보다 손실을 대략 두 배 가까이 크게 느끼는 경향이 관찰됐어요. 그래서 손실 난 주식은 너무 오래 붙잡고, 이익 난 주식은 너무 일찍 팔기 쉬워요.<br><b>매몰비용 오류</b>: 이미 쓴 돈(산 가격)에 매달려 판단하는 실수예요. 손절이 늘 옳은 것도, 버티기가 늘 옳은 것도 아니에요. 중요한 건 <b>판단의 기준을 「산 가격」이 아니라 「앞으로」에 두는 것</b>이에요.',
      practice:'「내 자산 → 🔁 거래 복기」에서 판 거래와 그때의 이유를 다시 읽어 보세요. 지금 손실 중인 종목이 있다면 「처음 본다면 살까?」라는 질문으로 감정 일기를 써 보세요.',
      review:'손실 회피 = 손실이 더 아프게 느껴짐 · 매몰비용 = 산 가격에 매달림 · 질문은 「지금 새로 사도 될까?」 · 물타기는 위험도 키울 수 있음'}; } },
{ id:'L10', title:'FOMO·확증편향·과도한 자신감', unlock:()=>S.clock.day>=8&&!!S.rivals, lock:'마을에서 8일을 지내면 열려요.',
  build(){
    const st=S.rivals.list.rooster.st, ant=S.rivals.list.ant.st;
    const top=[...IDS].sort((a,b)=>ret20(b)-ret20(a))[0];
    return {
      exp:`광장의 <b>크레이머닭</b>은 지금까지 내일 시장을 ${st.n||0}번 예측해서 <b>${st.hit||0}번</b> 맞혔어요(${st.n?Math.round((st.hit||0)/st.n*100):0}%). 매번 「확신도 ★★★★★」였죠. <b>불개미</b>는 오르는 종목을 따라 사다가 지금까지 ${ant.panics||0}번 공포에 질려 전부 팔았어요. 최근 20일 동안 가장 많이 오른 종목은 <b>${DEF[top].name}</b>(${pctTxt(ret20(top))})예요. 지금 사고 싶은 마음이 드나요?`,
      q:'맞는 설명을 모두 고르세요.', multi:true,
      opts:[{t:'확신에 찬 전망일수록 맞을 확률도 높다.',ok:false,why:`크레이머닭의 적중률을 보세요. 말투의 확신과 예측의 정확도는 별개예요.`},
        {t:'많이 오른 종목을 따라 사면, 좋은 소식이 이미 가격에 많이 들어가 있을 수 있다.',ok:true,why:'맞아요. 그렇다고 반드시 떨어지는 건 아니지만, 「왜 지금?」에 대한 내 답이 필요해요.'},
        {t:'내 생각과 반대되는 뉴스와 지표를 일부러 찾아보는 것이 확증편향을 줄이는 방법이다.',ok:true,why:'맞아요. 기업 도감의 「위험 요인」 칸이 그래서 있어요.'},
        {t:'몇 번 연속으로 수익이 나면 내 판단 실력이 증명된 것이다.',ok:false,why:'짧은 기간의 연속 수익은 운으로도 충분히 생길 수 있어요. 그 순간이 과도한 자신감이 가장 위험한 때예요.'},
        {t:'사기 전에 이유와 비중을 미리 적어 두면 분위기에 휩쓸리는 것을 줄일 수 있다.',ok:true,why:'맞아요. 주문할 때 「📝 판단 이유」를 남기는 습관이 도움이 돼요.'}],
      explain:'<b>FOMO</b>는 남들이 버는 걸 보며 나만 뒤처질까 봐 서두르는 마음, <b>확증편향</b>은 믿고 싶은 정보만 보는 경향, <b>과도한 자신감</b>은 몇 번의 성공으로 실력을 과대평가하는 경향이에요. 셋은 자주 함께 나타나요. 강세장에서는 「다들 버는데」가 FOMO를, 연속 수익이 과도한 자신감을, 「이번엔 다르다」는 이야기가 확증편향을 키워요.',
      practice:'주문할 때 「📝 판단 이유」에서 「많이 올라서(놓칠까 봐)」를 고르게 된다면, 한 번 멈추고 기업 도감의 위험 요인을 먼저 읽어 보세요.',
      review:'FOMO = 놓칠까 봐 서두름 · 확증편향 = 보고 싶은 것만 봄 · 과도한 자신감 = 운을 실력으로 착각 · 확신 ≠ 정확'}; } },
{ id:'L11', title:'최대 낙폭·투자 기간·위험 허용도', unlock:()=>S.pf.valHist.length>=30, lock:'30거래일이 지나면 열려요.',
  build(){
    const ih=S.ix.D500.hist.map(h=>({d:h.d,v:h.v})), mi=mddArr(ih), mm=mddArr(S.pf.valHist.map(v=>({d:v.d,v:v.v})));
    const under=IDS.filter(i=>co(i).price<maxClose(i,250)*0.7).length;
    return {
      exp:`지금까지 도토리 500의 최대 낙폭은 <b>${pctTxt(mi.m)}</b>, 내 계좌의 최대 낙폭은 <b>${pctTxt(mm.m)}</b>예요. 그리고 지금 42개 회사 중 <b>${under}곳</b>은 최근 1년 최고가보다 30% 넘게 낮은 상태예요.`,
      q:'맞는 설명을 모두 고르세요.', multi:true,
      opts:[{t:'−50% 손실을 회복하려면 +50% 수익이면 된다.',ok:false,why:'100만 원이 50만 원이 되면, 다시 100만 원이 되려면 +100%가 필요해요. 낙폭이 깊을수록 회복은 훨씬 어려워져요.'},
        {t:'최대 낙폭은 투자하는 동안 겪은 가장 큰 하락을 보여 준다.',ok:true,why:'맞아요. 최종 수익률이 같아도 가는 길의 고통은 전혀 다를 수 있어요.'},
        {t:'오래 기다리면 모든 주식은 결국 예전 고점을 회복한다.',ok:false,why:`지금도 ${under}곳이 고점보다 30% 넘게 낮아요. 회사의 경쟁력이 약해졌거나 파산 위기를 겪으면 회복하지 못할 수도 있어요.`},
        {t:'곧 써야 할 돈일수록 큰 낙폭을 견디기 어렵다.',ok:true,why:'맞아요. 투자 기간이 짧으면 떨어졌을 때 회복을 기다릴 시간이 없어요.'},

/* ============================== 10. 월드(마을 지도) ============================== */
const BUILDINGS = [
  {id:'broker', name:'너굴증권', x:25,y:8,w:13,h:6, roofH:2.6, wall:'#fff2dc', roof:'#79b8a2', trim:'#3f8a74', kind:'broker', enter:true},
  {id:'school', name:'부엉이 경제학교', x:7,y:13,w:11,h:7, roofH:2.6, wall:'#fde9d2', roof:'#ae8ad6', trim:'#7a58a3', kind:'school', enter:true},
  {id:'news', name:'곰곰 뉴스 방송국', x:50,y:13,w:10,h:7, roofH:2.2, wall:'#e8f2fb', roof:'#e88b7d', trim:'#b55e52', kind:'news', enter:true},
  {id:'palace', name:'도토리 대통령궁', x:41,y:3,w:14,h:6, roofH:2.0, wall:'#fffaf0', roof:'#d8b26a', trim:'#a9823d', kind:'palace', enter:true},
  {id:'home', name:'나의 집', x:8,y:31,w:7,h:5, roofH:2.2, wall:'#fff4e0', roof:'#f0a97a', trim:'#c47b52', kind:'home', enter:true},
];
CATS.forEach((c,k)=>BUILDINGS.push({id:'dist_'+c.id, dist:c.id, name:c.short, x:36+3.6*k, y:32, w:3.2, h:4, roofH:1.5, wall:'#fffaf2', roof:c.color, trim:shade(c.color,-0.3).replace('rgb','rgb'), kind:'district', enter:true}));
BUILDINGS.forEach(b=>{ b.door={x:b.x+b.w/2, y:b.y+b.h}; });
const PATHS=[[2,21,60,3],[30,14,3,24],[11,20,3,2],[54,20,3,2],[47,9,2,13],[5,36,57,2]];
const PLAZA=[23,16,18,13];
const POND={cx:22.5*T, cy:32*T, rx:4.2*T, ry:2.4*T};
const FOUNTAIN={x:31.5*T, y:22.5*T};
const BOARD={x:26*T, y:19*T};
const BENCHES=[{x:27.5*T,y:26*T},{x:35.5*T,y:26*T}];
const FLOWERBEDS=[[23.4,16.4],[38.4,16.4],[23.4,27.6],[38.4,27.6],[16,19.2],[57,19.2]];
let GRID=[], SOLIDS=[], TREES=[], LAMPS=[], GROUND=null, MINIBASE=null;

function buildWorld(){
  GRID=[]; for(let y=0;y<MAP_H;y++){ GRID.push(new Array(MAP_W).fill(0)); }
  const mark=(x,y,w,h,v)=>{ for(let ty=Math.floor(y);ty<Math.ceil(y+h);ty++) for(let tx=Math.floor(x);tx<Math.ceil(x+w);tx++) if(GRID[ty]&&GRID[ty][tx]!==undefined) GRID[ty][tx]=v; };
  mark(...PLAZA,2); PATHS.forEach(p=>mark(...p,1));
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){
    const dx=((tx+0.5)*T-POND.cx)/POND.rx, dy=((ty+0.5)*T-POND.cy)/POND.ry; if(dx*dx+dy*dy<1) GRID[ty][tx]=3;
  }
  BUILDINGS.forEach(b=>mark(b.x-0.5,b.y-b.roofH,b.w+1,b.h+b.roofH,4));
  FLOWERBEDS.forEach(f=>mark(f[0],f[1],2.4,1.4,5));
  SOLIDS=[];
  BUILDINGS.forEach(b=>SOLIDS.push({x:b.x*T,y:b.y*T,w:b.w*T,h:b.h*T}));
  SOLIDS.push({x:FOUNTAIN.x-58,y:FOUNTAIN.y-20,w:116,h:46});
  SOLIDS.push({x:BOARD.x-28,y:BOARD.y-8,w:56,h:10});
  BENCHES.forEach(b=>SOLIDS.push({x:b.x-28,y:b.y-6,w:56,h:8}));
  SOLIDS.push({x:POND.cx-POND.rx*0.92,y:POND.cy-POND.ry*0.75,w:POND.rx*1.84,h:POND.ry*1.5});
  // 가로등
  LAMPS=[];
  for(let x=6;x<60;x+=8){ if(x>=29&&x<=34) continue; LAMPS.push({x:x*T,y:20.7*T},{x:(x+4)*T,y:24.3*T}); }
  LAMPS.forEach(l=>SOLIDS.push({x:l.x-3,y:l.y-4,w:6,h:5}));
  // 나무
  TREES=[];
  const near=(tx,ty,r)=>{ for(let y=ty-r;y<=ty+r;y++) for(let x=tx-r;x<=tx+r;x++){ if(y<0||x<0||y>=MAP_H||x>=MAP_W) continue; if(GRID[y][x]!==0) return true; } return false; };
  for(let ty=1;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){
    if(GRID[ty][tx]!==0) continue;
    const border=tx<2||tx>=MAP_W-2||ty<3||ty>=MAP_H-2;
    const h=hash(tx,ty);
    if((border && h>0.3 && !near(tx,ty,0)) || (!border && h<0.075 && !near(tx,ty,1))){
      const tr={x:(tx+0.5)*T+(hash(tx,ty+9)-0.5)*14, y:(ty+0.8)*T, s:0.85+hash(ty,tx)*0.45, ph:h*20};
      TREES.push(tr); SOLIDS.push({x:tr.x-6,y:tr.y-7,w:12,h:7});
    }
  }
  GROUND=buildGround(); MINIBASE=buildMiniBase();
}
function buildGround(){
  const cv=document.createElement('canvas'); cv.width=WORLD_W; cv.height=WORLD_H; const g=cv.getContext('2d');
  g.fillStyle='#bfe6b9'; g.fillRect(0,0,WORLD_W,WORLD_H);
  for(let i=0;i<1100;i++){ const x=hash(i,1)*WORLD_W, y=hash(i,2)*WORLD_H; ell(g,x,y,10+hash(i,3)*26,6+hash(i,4)*14,i%2?'rgba(255,255,255,.08)':'rgba(70,140,80,.07)'); }
  g.strokeStyle='rgba(80,150,90,.35)'; g.lineWidth=1.2;
  for(let i=0;i<3200;i++){ const x=hash(i,7)*WORLD_W, y=hash(i,8)*WORLD_H; const tx=Math.floor(x/T), ty=Math.floor(y/T); if(GRID[ty]&&GRID[ty][tx]!==0) continue;
    g.beginPath(); g.moveTo(x-2,y-3); g.lineTo(x,y); g.lineTo(x+2,y-3); g.stroke(); }
  // 광장
  const [px,py,pw,ph]=PLAZA;
  g.fillStyle='#e9dcc4'; rr(g,px*T,py*T,pw*T,ph*T,26); g.fill();
  g.strokeStyle='#d8c6a6'; g.lineWidth=3; g.stroke();
  g.strokeStyle='rgba(190,170,135,.35)'; g.lineWidth=1;
  for(let y=py*T+16;y<(py+ph)*T-8;y+=24) for(let x=px*T+16;x<(px+pw)*T-8;x+=24){ rr(g,x+((y/24)%2?12:0),y,20,20,6); g.stroke(); }
  ell(g,FOUNTAIN.x,FOUNTAIN.y+4,110,52,'rgba(220,205,175,.7)');
  // 길
  for(const p of PATHS){ g.fillStyle='#f2e2c0'; rr(g,p[0]*T,p[1]*T,p[2]*T,p[3]*T,12); g.fill(); }
  for(const p of PATHS){ g.strokeStyle='rgba(205,180,135,.5)'; g.lineWidth=2; rr(g,p[0]*T+2,p[1]*T+2,p[2]*T-4,p[3]*T-4,11); g.stroke(); }
  for(let i=0;i<900;i++){ const x=hash(i,11)*WORLD_W, y=hash(i,12)*WORLD_H; const tx=Math.floor(x/T), ty=Math.floor(y/T); if(!GRID[ty]||GRID[ty][tx]!==1) continue; ell(g,x,y,2+hash(i,13)*2,1.5,'rgba(190,165,120,.35)'); }
  // 연못 둑
  ell(g,POND.cx,POND.cy+6,POND.rx+14,POND.ry+12,'#a9d6a0');
  ell(g,POND.cx,POND.cy,POND.rx+6,POND.ry+6,'#d9c9a3');
  // 꽃밭
  const fc=['#ff9fb2','#ffd166','#c3a6ff','#ffffff','#ff8f6b'];
  FLOWERBEDS.forEach((f,k)=>{ const x=f[0]*T,y=f[1]*T; g.fillStyle='#a9805e'; rr(g,x,y,2.4*T,1.4*T,14); g.fill(); g.fillStyle='#8fc47e'; rr(g,x+4,y+4,2.4*T-8,1.4*T-8,10); g.fill();
    for(let i=0;i<26;i++){ const fx=x+8+hash(k,i)*(2.4*T-16), fy=y+8+hash(i,k+3)*(1.4*T-16); ell(g,fx,fy,3,3,fc[(i+k)%fc.length]); ell(g,fx,fy,1.1,1.1,'#ffef9a'); } });
  return cv;
}
function buildMiniBase(){
  const cv=document.createElement('canvas'); cv.width=200; cv.height=144; const g=cv.getContext('2d');
  const sx=200/MAP_W, sy=144/MAP_H; const col=['#bfe6b9','#f2e2c0','#e9dcc4','#8fd0e8','#bfe6b9','#ffb7c5'];
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){ g.fillStyle=col[GRID[y][x]]; g.fillRect(x*sx,y*sy,sx+0.6,sy+0.6); }
  TREES.forEach(t=>{ g.fillStyle='#7fb07a'; g.fillRect(t.x/T*sx-1,t.y/T*sy-2,2.4,2.4); });
  BUILDINGS.forEach(b=>{ g.fillStyle=b.roof; g.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy); });
  return cv;
}

function tariffShock(e,c,P,dTau){
  P.tariff=clamp(Math.round(P.tariff+dTau),0,60);
  e.trade=clamp(e.trade+dTau*0.02,0,1);
  e.infl+=dTau*0.025; c.rateShock+=dTau*0.004;
  const expected=RNG.chance(0.25);           // 이미 시장이 예상했던 발표일 수도 있어요
  const k=expected?0.35:1;
  c.dSent += -dTau*0.012*k*RNG.range(0.5,1.5);
  c.gAdj=c.gAdj||{};
  for(const id of IDS){ const d=DEF[id];
    c.co[id]=(c.co[id]||0)+d.tradeS*dTau*0.0025*k*RNG.range(0.3,1.7);   // 관세 민감도(수입·해외 의존)만큼
    c.gAdj[id]=(c.gAdj[id]||0)+d.tradeS*dTau*0.0004; }                  // 이익(성장) 전망도 조금 바뀜
  c.group.util+=0.0008*dTau*k; c.group.tele+=0.0008*dTau*k;             // 국내 중심 업종은 상대적으로 덜 영향
  return expected;
}

const PRES_EV={}; PRES_EVENTS.forEach(x=>PRES_EV[x.id]=x);

function applyGAdj(g){ for(const id in g){ const c=co(id); c.gExp=clamp(c.gExp+g[id],-0.15,0.4); c.exp.rev*=1+g[id]; c.exp.eps*=1+g[id]; } }
function presNews(ev,out,P,ecoText,min){

  return {type:'대통령', sev:PRES_TIERS[tier].sev, tier, presId:ev.id, title:out.title, body:out.body, learn:out.learn, quote:out.quote, scene:out.scene, emo:out.emo,

/* 하루 시작에 대통령 발표가 있을지 결정 (장 시작 전 발표 또는 장중 긴급 발표) */
function presRoll(ctx,todays){
  const P=JSON.parse(JSON.stringify(S.pres)), day=S.clock.day, lv=PRES_LEVEL[(S.settings&&S.settings.presLevel)||'normal'];
  let ev=null;
  if(P.follow && day>=P.follow.day){ const ids=P.follow.ids.filter(id=>{ const E=PRES_EV[id]; return !E.cond||E.cond(P); }); P.follow=null; if(ids.length && RNG.chance(0.75)) ev=PRES_EV[RNG.pick(ids)]; }
  if(!ev){ const r=RNG.next(); let acc=0, tier=null;
    for(const t of ['crisis','strong','mid','chat']){ acc+=PRES_TIERS[t].p*lv; if(r<acc){ tier=t; break; } }
    if(tier){ const pool=PRES_EVENTS.filter(x=>x.tier===tier&&!x.follow&&(!x.cond||x.cond(P))); if(pool.length) ev=RNG.pick(pool); } }
  if(!ev){ S.pres=P; return null; }
  const intra = ev.tier!=='crisis' && ev.id!=='dawn_sns' && RNG.chance(0.3);
  if(!intra){
    const before=ecoSnap(S.eco,ctx), g0=ctx.gAdj||{}; ctx.gAdj={};
    const out=ev.run(S.eco,ctx,P); applyGAdj(ctx.gAdj); ctx.gAdj=g0;
    P.tHist.push({d:day, v:P.tariff}); P.history.push({day, id:ev.id, tier:ev.tier});
    S.pres=P;
    todays.push(presNews(ev,out,P,ecoDiffText(before,ecoSnap(S.eco,ctx)), out.scene==='sns'?6*60:7*60+45));
    return null;
  }
  // 장중 긴급 발표: 경제 변수 변화는 발표 시각에 적용하고, 주가 경로에는 그 시각부터 반영해요
  const eSnap={...S.eco}, c2=freshCtx(), before=ecoSnap(S.eco,c2);
  const out=ev.run(S.eco,c2,P); const eco2=ecoDiffText(before,ecoSnap(S.eco,c2));
  const eDelta={}; for(const k of ['lnOil','trade','geo','infl','growth']) eDelta[k]=S.eco[k]-eSnap[k];
  Object.assign(S.eco,eSnap);
  const k=6+Math.floor(RNG.next()*24), m2=0.07*c2.dSent, shocks={};
  for(const id of IDS){ const d=DEF[id];
    shocks[id]=clamp(d.beta*m2 + d.oilS*eDelta.lnOil + d.rateS*c2.rateShock + d.tradeS*eDelta.trade*0.05 + d.geoS*eDelta.geo*0.05 + d.cycS*eDelta.growth*0.03
      + (c2.group[d.group]||0)*(0.6+0.8*RNG.next()) + (c2.co[id]||0), -0.25, 0.25); }
  const fxShock=-0.03*c2.dSent + 0.012*c2.rateShock + 0.012*eDelta.geo + c2.fx;
  P.tHist.push({d:day, v:P.tariff}); P.history.push({day, id:ev.id, tier:ev.tier, intra:true});
  return {k, eDelta, rateShock:c2.rateShock, dSent:c2.dSent, P, gAdj:c2.gAdj, shocks, fxShock, news:presNews(ev,out,P,eco2,OPEN_MIN+k*TICK_MIN), done:false};
}
function applyIntraToPaths(dd){
  const I=dd.intra, K=I.k;
  for(const id of IDS){ const p=dd.paths[id], s=I.shocks[id]; for(let k=K;k<=TICKS;k++) p[k]*=Math.exp(s*Math.min(1,(k-K+1)/3));
    for(let k=K;k<Math.min(TICKS+1,K+6);k++) dd.vols[id][k]=Math.round(dd.vols[id][k]*(1+Math.abs(s)*30)); }
  for(let k=K;k<=TICKS;k++) dd.fxPath[k]*=Math.exp(I.fxShock*Math.min(1,(k-K+1)/3));
}
function announceIntra(dd){
  const I=dd.intra; if(!I||I.done) return; I.done=true;
  const e=S.eco; for(const k in I.eDelta) e[k]+=I.eDelta[k];
  e.rateExp=clamp(e.rateExp+I.rateShock,0.25,9); e.sent=clamp(e.sent+I.dSent,-1,1);
  applyGAdj(I.gAdj); S.pres=I.P;
  const n=pushNews({...I.news, title:'[장중 긴급 발표] '+I.news.title});
  if(!SILENT){ queueBroadcast(n.id); toast(`📢 장중 긴급 발표: ${I.news.title}`,'news'); Sound.news(); }
}

function seededShuffle(arr,seed){   // 시장 난수와 무관한 화면용 섞기 (같은 날엔 같은 순서)
  let st=seed>>>0; const r=()=>{ st=(st+0x6D2B79F5)>>>0; let t=st; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
  const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 국면 전환 — rnd: 0~1 난수 함수 (게임에서는 시장 난수, 검증 테스트에서는 별도 난수) */
function regimeStep(M,eco,rnd,P,day,idx){
  M.days++;
  const k=P.crisisK, stress=Math.max(0,-eco.sent)*1.5+Math.max(0,1-eco.growth)*0.8+eco.geo*0.8, up=Math.max(0,eco.sent);
  const r=rnd(), int=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const go=to=>{ const dur=to==='crash'?int(3,9):to==='rally'?int(4,14):0; if(to==='side') M.anchor=idx; setReg(M,to,dur,day); return to; };
  switch(M.reg){
    case 'bull': { const pc=0.0006*k*(1+stress), pb=0.0025*k*(1+stress), ps=0.005; if(r<pc) return go('crash'); if(r<pc+pb) return go('bear'); if(r<pc+pb+ps) return go('side'); break; }
    case 'side': { const pc=0.0006*k*(1+stress), pb=0.005*k*(1+stress), pu=0.010*(1+up); if(r<pc) return go('crash'); if(r<pc+pb) return go('bear'); if(r<pc+pb+pu) return go('bull'); break; }

const PSY_Q={q:[], cur:null};
function psyInit(){ return {ev:[], n:0, peak:null, ddF:[], hope:{ph:'none', peak:0, peakDay:0, trough:0, ddMax:0}, last:{}, resets:0, today:[]}; }
function psyAdd(type,key,data){
  const P=S.psy; if(key){ if(P.last[key]!=null) return; P.last[key]=S.clock.day; }
  const D=PSY_EV[type], body=D.make(data);
  const ev={id:++P.n, type, day:S.clock.day, pr:D.pr, npc:D.npc(data), c:D.c, ...body};
  P.ev.push(ev); if(P.ev.length>150) P.ev.shift(); P.today.push(ev);
  if(type==='dd'&&data.th>=0.2) giveBadge('stormSurvivor');
  if(new Set(P.ev.flatMap(e=>e.c)).size>=5) giveBadge('bias5');
}
function idxDD(n=250){ const h=S.ix.D500.hist; let m=0; for(let i=Math.max(0,h.length-n);i<h.length;i++) m=Math.max(m,h[i].v); return h[h.length-1].v/m-1; }
function idxAt(day){ const h=S.ix.D500.hist; for(let i=h.length-1;i>=0;i--) if(h[i].d<=day) return h[i].v; return h[0].v; }
function lastBuy(id){ for(let i=S.trades.length-1;i>=0;i--){ const t=S.trades[i]; if(t.cid===id&&t.side==='buy') return t; } return null; }
function countNotRecovered(sinceDay){ let n=0; for(const id of IX.D500.members){ const h=co(id).hist; const i=h.findIndex(x=>x.d>=sinceDay); if(i>=0 && co(id).price<h[i].c*0.8) n++; } return n; }
function psyDaily(){
  if(S.psyOff) return;

  // ① 내 거래 돌아보기
  for(let i=S.trades.length-1;i>=0;i--){ const t=S.trades[i]; if(day-t.day>25) break; if(t.side!=='buy'&&t.side!=='sell') continue;
    const p=co(t.cid).price, r=p/t.price-1, dd=day-t.day;
    if(t.side==='sell'){ if(t.realized<0 && dd<=15 && r>=0.15) psyAdd('stopRebound','sr'+t.id,{t,p,r}); else if(t.realized>=0 && dd<=20 && r>=0.25) psyAdd('sellRally','sw'+t.id,{t,p,r}); }
    else { const cx=t.ctx||{}; const chased=(cx.r5>=0.15||cx.r20>=0.3);
      if(chased && dd<=10 && r<=-0.10) psyAdd('chase','ch'+t.id,{t,p,r});
      else if(!chased && dd<=5 && r<=-0.10) psyAdd('buyDrop','bd'+t.id,{t,p,r});
      if(dd<=1 && cx.plBefore!=null && cx.plBefore<=-0.1) psyAdd('avgDown','ad'+t.id,{t,cx}); } }
  // ② 가진 종목
  const tot=totalAssets();
  for(const id in S.pf.hold){ const h=S.pf.hold[id], c=co(id), r=c.price/h.avg-1, w=h.qty*c.price*S.fx/tot;
    if(h.since!=null && day-h.since>=60 && r<=0){ const ir=lastIdx()/idxAt(h.since)-1; if(ir>=0.05) psyAdd('longWait','lw'+id+':'+h.since+':'+Math.floor((day-h.since)/60),{id,r,ir,days:day-h.since}); }
    const bt=lastBuy(id); if(bt&&bt.ctx&&bt.ctx.fairR>=1.35&&DEF[id].margin>=0.15&&r<=-0.15) psyAdd('pricey','pr'+bt.id,{id,r,fr:bt.ctx.fairR});
    if(w>=0.5 && r>=0.3) psyAdd('luckyWin','lk'+id+':'+Math.floor(day/120),{id,r,w});
    if(c.bk && c.bk.day===day) psyAdd('bkHeld','bk'+id+':'+day,{id,w});
    if(c.scandal && c.scandal.day===day) psyAdd('scandalHeld','sc'+id+':'+day,{id,w,r1:c.lastRet}); }
  // ③ 내 계좌 낙폭
  if(S.pf.resets!==P.resets){ P.resets=S.pf.resets; P.peak=null; }
  if(!P.peak||tot>P.peak.v){ P.peak={v:tot,d:day}; P.ddF=[]; }
  { const dd=tot/P.peak.v-1; for(const th of [0.1,0.2,0.3,0.4]) if(dd<=-th && !P.ddF.includes(th)){ P.ddF.push(th); if(P.ddF.length===1||th>=0.2) psyAdd('dd',null,{th,dd,peak:P.peak}); } }
  // ④ 시장의 희망고문·회복 관찰
  { const iv=lastIdx(), H=P.hope;
