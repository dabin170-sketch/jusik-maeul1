        else if(!H.big && iv>=H.trough*1.2){ H.big=true; psyAdd('bigRebound','br'+day,{trough:H.trough, now:iv, peak:H.peak}); } } } }
  // ⑤ 현금 부족 · 비교 · 시장 대비 부진
  const held=Object.keys(S.pf.hold).length>0;
  if(held && idxDD()<=-0.15 && lastIdxRet()<=-0.02 && day-(P.last.cs||-99)>=20){ const cashW=(S.pf.krw+S.pf.usd*S.fx)/tot; if(cashW<0.05){ P.last.cs=day; psyAdd('cashShort',null,{cashW,dd:idxDD()}); } }
  if(S.rivals && day-S.rivals.start>=20 && day-(P.last.peer||-99)>=30 && S.trades.some(t=>t.side==='buy')){
    const my=myRetSince(S.rivals.start); let best=null; for(const r of RIVAL_DEFS){ const rr=rvRet(r.id); if(!best||rr>best.rr) best={rid:r.id,rr}; }
    if(best && best.rr-my>=0.15){ P.last.peer=day; psyAdd('peer',null,{rid:best.rid, rr:best.rr, my}); } }
  { const vh=S.pf.valHist; if(held && vh.length>61 && day-(P.last.up||-99)>=45){ const a=vh[vh.length-61], b=vh[vh.length-1]; const my=b.v/a.v-1, ix=(b.idx*b.fx)/(a.idx*(a.fx||b.fx))-1; if(my-ix<=-0.10){ P.last.up=day; psyAdd('underperf',null,{my,ix}); } } }
  // 오래된 기록 키 정리
  if(day%30===0) for(const k in P.last) if(day-P.last[k]>200) delete P.last[k];
  if(!SILENT && P.today.length){
    const top=P.today.slice().sort((a,b)=>b.pr-a.pr)[0];
    if(S.settings.psyPop!==false){ PSY_Q.q.push(top.id); while(PSY_Q.q.length>2) PSY_Q.q.shift(); }
    if(P.today.length>1||S.settings.psyPop===false) toast(`💭 투자 마음 기록 ${P.today.length}건 — 「📈 내 자산 → 💭 마음 기록」에서 볼 수 있어요`);
  }
}

function rvSet(r,targets,fee=0){

function pfChangeHtml(){
  const H=S.pfHist||[]; const out=[];
  for(let i=1;i<H.length;i++){ const a=H[i-1].w, b=H[i].w; const add=Object.keys(b).filter(k=>!a[k]), rem=Object.keys(a).filter(k=>!b[k]);
    const big=Object.keys(b).filter(k=>a[k]&&Math.abs(b[k]-a[k])>=0.1);
    if(add.length||rem.length||big.length) out.push(`<tr><td>${dateLabel(H[i].d)}</td><td>${add.map(k=>'➕ '+nm(k)).concat(rem.map(k=>'➖ '+nm(k))).concat(big.map(k=>`${nm(k)} ${(a[k]*100).toFixed(0)}→${(b[k]*100).toFixed(0)}%`)).join(' · ')}</td><td>${Object.keys(b).length}개</td><td>${(H[i].c*100).toFixed(0)}%</td></tr>`); }
  return out.length?`<table class="tbl" style="margin-top:8px"><tr><th>날짜(장 마감)</th><th>변화</th><th>보유 종목</th><th>현금 비중</th></tr>${out.reverse().slice(0,30).join('')}</table>`:'<div class="small muted" style="margin-top:6px">아직 포트폴리오 변화가 없어요.</div>';
}
function drawStack(cvEl){
  if(!cvEl) return; const {g,W,H}=setupCanvas(cvEl); const rows=(S.pfHist||[]).slice(-120);
  if(!rows.length){ g.fillStyle='#9a8a78'; g.font='13px Gowun Dodum'; g.fillText('장이 마감되면 기록이 쌓여요',20,H/2); return; }
  const bw=(W-10)/rows.length;
  rows.forEach((r,i)=>{ let y=H-16; const ent=Object.entries(r.w).sort((a,b)=>b[1]-a[1]);
    for(const [k,w] of ent){ const h=w*(H-20); g.fillStyle=DEF[k]?DEF[k].color:'#ccc'; g.fillRect(5+i*bw,y-h,Math.max(1,bw-0.5),h); y-=h; }
    const h=r.c*(H-20); g.fillStyle='#e9dfcf'; g.fillRect(5+i*bw,y-h,Math.max(1,bw-0.5),h); });
  g.fillStyle='#9a8a78'; g.font='11px Gowun Dodum'; g.fillText(`${dateLabel(rows[0].d)} ~ ${dateLabel(rows[rows.length-1].d)} · 색 = 종목, 베이지 = 현금`,8,H-3);
}

function updateNPCs(dt){

    const dx=n.target.x-n.x, dy=n.target.y-n.y, d=Math.hypot(dx,dy);
    if(d<3){ n.target=null; n.wait=1.5+Math.random()*3.5; n.moving=false; continue; }
    const vx=dx/d*n.speed*dt, vy=dy/d*n.speed*dt;
    const nx=n.x+vx, ny=n.y+vy;
    if(collides(nx,ny,true)||Math.hypot(nx-S_px(),ny-S_py())<16){ n.target=null; n.wait=0.8; n.moving=false; continue; }
    n.x=nx; n.y=ny; n.moving=true; n.phase+=dt*(n.speed/10);

function collides(x,y,npc){
  if(x<20||x>WORLD_W-20||y<40||y>WORLD_H-12) return true;
  const r={x:x-7,y:y-6,w:14,h:6};
  for(const c of SOLIDS) if(r.x<c.x+c.w&&r.x+r.w>c.x&&r.y<c.y+c.h&&r.y+r.h>c.y) return true;
  if(S&&S.life&&festNow()) for(const c of FEST_SOLIDS) if(r.x<c.x+c.w&&r.x+r.w>c.x&&r.y<c.y+c.h&&r.y+r.h>c.y) return true;
  return false;
}
function updatePlayer(dt){
  const p=S.player; let dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA) dx-=1; if(keys.ArrowRight||keys.KeyD) dx+=1;
  if(keys.ArrowUp||keys.KeyW) dy-=1; if(keys.ArrowDown||keys.KeyS) dy+=1;
  if(dx||dy){
    const l=Math.hypot(dx,dy); dx/=l; dy/=l; const sp=118*dt;
    const ox=p.x, oy=p.y, stuck=collides(p.x,p.y);   // 축제 부스가 생긴 자리에 서 있었다면 빠져나올 수 있게
    if(stuck||!collides(p.x+dx*sp,p.y)) p.x+=dx*sp;
    if(stuck||!collides(p.x,p.y+dy*sp)) p.y+=dy*sp;
    PL.moving=true; PL.phase+=dt*11;
    p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
    S.walked+=Math.hypot(p.x-ox,p.y-oy);
    if(S.walked>240) setQuest('walk');

    updateFestival();

  if(mode==='play'&&S){
    const busy=!$('#panel').classList.contains('hidden')||!$('#dialog').classList.contains('hidden')||!$('#menu').classList.contains('hidden')||!!PB.cur||!!PSY_Q.cur||!!MP.card;
    if(!busy) updatePlayer(dt); else PL.moving=false;

    if(!paused && !menuOpen && !MP.on) advanceClock(dt*MIN_PER_SEC*S.settings.speed);   // 친구 마을에서는 서버만 시간을 움직여요
    mpTick(dt);
    updatePrompt(busy);
  }
  updateNPCsSafe(dt);
  render();
  if(PB.cur) drawPresScene();
  else if(mode==='play'&&S&&!PSY_Q.cur&&PSY_Q.q.length&&$('#panel').classList.contains('hidden')&&$('#dialog').classList.contains('hidden')&&$('#menu').classList.contains('hidden')) showPsyNext();

  if(MP.on){ mpCardTick(); mpDrawCb(); }
  document.body.classList.toggle('mp-panel', MP.on && PANEL.open);

  g.fillStyle='#9a8a78'; g.textAlign='left'; g.fillText('거래량',padL,vT+6);
  g.textAlign='center'; const step=Math.max(1,Math.ceil(n/6)); for(let i=0;i<n;i+=step){ const d=data[i].d; g.fillText(d<1?`${d}일`:`${d}일차`,X(i),H-7); }
  g.textAlign='left'; g.font='10px Gowun Dodum, sans-serif';
  const lg=[['#f0a35e','5일 평균'],['#9c7cc8','20일 평균'],['#2f6fd1','▲ 매수'],['#d9534f','▼ 매도'],['#9c7cc8','● 실적'],['#f0a35e','● 뉴스']]; let lx=padL;
  lg.forEach(([cc,t])=>{ g.fillStyle=cc; g.fillText(t,lx,6); lx+=g.measureText(t).width+10; });
}
function drawLineChart(cvEl,series,opt={}){
  if(!cvEl) return; const {g,W,H}=setupCanvas(cvEl);
  const padL=6,padR=58,padT=18,padB=20; let lo=Infinity,hi=-Infinity,xs=new Set();
  series.forEach(s=>s.pts.forEach(p=>{lo=Math.min(lo,p.y);hi=Math.max(hi,p.y);xs.add(p.x);}));
  if(!isFinite(lo)){ g.fillStyle='#9a8a78'; g.font='13px Gowun Dodum'; g.fillText('아직 데이터가 없어요',20,H/2); return; }
  const pad=(hi-lo)*0.1||Math.abs(hi)*0.05||1; lo-=pad; hi+=pad;
  const xa=[...xs].sort((a,b)=>a-b), x0=xa[0], x1=xa.length>1?xa[xa.length-1]:x0+1;
  const X=x=>padL+(x-x0)/Math.max(1,x1-x0)*(W-padL-padR), Y=y=>padT+(hi-y)/(hi-lo)*(H-padT-padB);
  g.font='11px Gowun Dodum, sans-serif'; g.textBaseline='middle';
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, y=Y(v); g.strokeStyle='#efe5d4'; g.beginPath(); g.moveTo(padL,y); g.lineTo(W-padR,y); g.stroke(); g.fillStyle='#9a8a78'; g.textAlign='left'; g.fillText(opt.fmt?opt.fmt(v):v.toFixed(1),W-padR+6,y); }
  if(opt.zero && lo<0 && hi>0){ g.strokeStyle='#c9b9a0'; g.setLineDash([4,3]); g.beginPath(); g.moveTo(padL,Y(0)); g.lineTo(W-padR,Y(0)); g.stroke(); g.setLineDash([]); }
  series.forEach(s=>{ g.beginPath(); s.pts.forEach((p,i)=>i?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y))); g.strokeStyle=s.color; g.lineWidth=2; if(s.dash) g.setLineDash(s.dash); g.stroke(); g.setLineDash([]); });
  g.textAlign='left'; let lx=padL; series.forEach(s=>{ g.fillStyle=s.color; g.fillText('━ '+s.name,lx,7); lx+=g.measureText('━ '+s.name).width+12; });
  g.fillStyle='#9a8a78'; g.textAlign='center'; const lab=x=>x<1?`${x}일`:`${x}일차`; g.fillText(lab(x0),padL+24,H-7); g.fillText(lab(x1),W-padR-20,H-7);
}

function placeFromUI(){
  const id=ODR.id, c=co(id);
  if(ODR.type==='limit' && !ODR.limit) ODR.limit=cents(c.price);
  if(ODR.side==='buy'){
    const tot=totalAssets(), unit=ODR.type==='limit'?ODR.limit:c.price;
    const after=((S.pf.hold[id]?S.pf.hold[id].qty:0)+ODR.qty)*c.price*S.fx/tot;
    if(after>0.6 && !ODR.confirm && ODR.qty*unit<=availCash()){ ODR.confirm=after; ODR.msg=''; renderPanel(true); return; }
  }
  const why=(ODR.whyTag||(ODR.why||'').trim())?{tag:ODR.whyTag||'', text:(ODR.why||'').trim()}:null;
  if(MP.on){
    if(ODR.busy || Date.now()<(ODR.lockUntil||0)) return;         // 연속 클릭 방지: 결과가 오고 잠깐 더 기다려요
    ODR.busy=true; ODR.lockUntil=Date.now()+900; ODR.msg='⏳ 서버에 주문을 보내는 중…'; ODR.msgOk=true; ODR.confirm=false; renderPanel(true);
    mpReq({t:'market:order', cid:id, side:ODR.side, type:ODR.type, qty:Math.floor(ODR.qty), limit:ODR.type==='limit'?Number(ODR.limit):0, why}, r=>{
      ODR.busy=false; ODR.msg=r.msg; ODR.msgOk=r.ok; if(r.ok){ ODR.why=''; ODR.whyTag=''; Sound.coin(); } else Sound.click(); if(PANEL.open) renderPanel(true); });
    return;
  }
  const r=placeOrder(id,ODR.side,ODR.type,ODR.qty,ODR.limit,why);
  ODR.msg=r.msg; ODR.msgOk=r.ok; ODR.confirm=false; if(r.ok){ ODR.why=''; ODR.whyTag=''; }
  if(!r.ok) Sound.click();
  renderPanel(true);
}

function earnComment(x){
  if(x.react==null) return '장이 마감되면 실제 주가 반응을 확인할 수 있어요.';
  if(x.yoy>0 && x.react<0) return `매출은 전년보다 늘었는데 주가는 떨어졌어요. 예상과의 차이(${plainPct(x.revS)})와 다음 분기 전망 변화가 원인일 수 있어요. 시장 전체 분위기도 함께 살펴보세요.`;
  if((x.yoy<0||x.eps<0) && x.react>0) return '숫자 자체는 좋지 않았는데 주가가 올랐어요. 시장이 더 나쁜 결과를 예상했거나, 앞으로의 전망이 좋아졌다고 봤을 수 있어요.';
  return '주가 반응은 실적의 크기보다 기대와의 차이, 미래 전망, 시장 분위기가 합쳐진 결과예요.';
}

const NW={filter:'all'};
function newsCard(n){
  const rc=n.reaction;

    react=`<div class="react">📊 <b>시장 반응(그날 장 마감 기준)</b>: ${parts.join(' · ')}</div>`; }
  else if(n.type!=='시황') react=`<div class="react muted">📊 시장 반응: 장 마감 후 공개돼요 (미래 주가는 미리 알 수 없어요)</div>`;
  return `<div class="news"><div class="meta"><span class="badge">${n.type}</span>${n.sev>=3?'<span class="badge" style="background:#fde0dc;color:#b33">매우 큰 사건</span>':n.sev>=2?'<span class="badge" style="background:#fff0d6;color:#a8650e">주요</span>':''}

    <div class="nt">${esc(n.title)}</div>${n.quote?`<div style="font-family:Jua;color:#8a5a2e;margin:3px 0">🐿️ 「${esc(n.quote)}」</div>`:''}<div class="nb">${esc(n.body)}</div>
    ${n.ecoText?`<div class="small muted" style="margin-top:4px">🔧 경제 변화: ${esc(n.ecoText)}</div>`:''}${react}
    ${n.learn?`<div class="learn">🦉 학습 해설: ${esc(n.learn)}</div>`:''}</div>`;

    const d=DEF[cv.dataset.anim]; if(!d) return; drawAnimal(g,cv.width/2,cv.height-6,{species:d.animal,scale:cv.width/36,t:gameT,bubble:false,emo:'happy',tie:isEtf(d.id)?null:d.color}); });
}

const DEX={cat:'all', q:'', ix:'D500'};
function dexRows(){
  const q=DEX.q.trim().toLowerCase();
  let ids = DEX.cat==='all'?IDS : CATS.find(c=>c.id===DEX.cat).ids;
  if(q) ids=ids.filter(i=>(DEF[i].name+' '+i+' '+DEF[i].origT+' '+DEF[i].orig+' '+DEF[i].sector).toLowerCase().includes(q));
  if(!ids.length) return '<tr><td colspan="8" class="muted">해당하는 회사가 없어요.</td></tr>';
  return ids.map(id=>{ const d=DEF[id], c=co(id), per=perOf(id);
    return `<tr data-act="profile" data-arg="${id}" style="cursor:pointer"><td><span class="dot" style="background:${d.color}"></span><b>${d.name}</b> <span class="muted small">${id}</span></td>
      <td>${d.origT}</td><td style="text-align:left">${d.sector}</td><td>${usd(c.price)}</td><td>${pctHtml(dayChg(id))}</td><td>${bigUsd(marketCap(id))}</td><td>${per?per.toFixed(1)+'배':'적자'}</td><td>${(d.div/c.price*100).toFixed(2)}%</td></tr>`; }).join('');
}

    ${ETF_IDS.map(id=>{ const e=DEF[id]; return `<tr data-act="profile" data-arg="${id}" style="cursor:pointer"><td><span class="dot" style="background:${e.color}"></span><b>${e.name}</b> <span class="muted small">${id}</span></td><td>${IX[e.idx].name}</td><td>${usd(co(id).price)}</td><td>${pctHtml(dayChg(id))}</td><td>${(e.er*100).toFixed(2)}%</td><td>${(etfYield(id)*100).toFixed(2)}%</td><td>${IX[e.idx].members.length}개</td></tr>`; }).join('')}</table>

    <h4>⚠️ 위험</h4><ul><li>담긴 회사들이 함께 떨어지면 ETF도 떨어져요. 분산투자가 손실을 없애 주지는 않아요.</li><li>${x.w==='cap'?'시가총액 가중이라 큰 회사 몇 곳의 움직임이 ETF 가격을 크게 좌우해요.':'동일 가중이라 작은 회사도 큰 회사와 똑같은 영향을 줘요.'}</li><li>달러 자산이라 환율이 바뀌면 원화 평가액도 바뀌어요.</li></ul></div>

    <div class="note small">분배금은 분기(30일)마다 한 번, 담긴 회사들이 낸 배당을 비중대로 모아 1주당 달러로 나눠 줘요. 받은 분배금은 달러 예수금으로 들어와요.</div></div>`;

const LS={id:null,data:null,sel:new Set(),done:false};
function openSchool(){
  LS.id=null;
  openPanel({id:'school', title:'🦉 부엉이 경제학교', theme:'#9a76c9', live:false,
    npc:{name:'부엉이 선생님', look:{species:'owl',glasses:true}, line:()=>LS.id?'천천히 생각해 보세요. 틀려도 괜찮아요. 왜 그렇게 생각했는지가 더 중요하답니다.':'질문부터 해 볼까요? 이 학교에서는 먼저 마을에서 「경험」하고, 그다음에 개념을 배워요. 새 수업은 마을에서 일이 일어나면 열려요.', emo:()=>'happy'},
    tabs:[{id:'list',label:'📚 수업 목록'},{id:'dict',label:'📖 투자 심리 사전'},{id:'badges',label:'🏅 학습 성취'}], render:renderSchool}, 'list');
}
function renderSchool(tab){
  if(tab==='dict') return renderDict();
  if(tab==='badges'){
    const done=LESSONS.filter(L=>S.lessons[L.id]).length;
    return `<div class="sec"><h3>학습 진행도 ${done} / ${LESSONS.length}</h3><div class="alloc"><div style="width:${done/LESSONS.length*100}%;background:#9a76c9"></div><div style="flex:1;background:#efe2fb"></div></div></div>
      <div class="sec"><h3>업적</h3>${Object.keys(BADGES).map(k=>`<div class="lesson ${S.badges[k]?'done':'locked'}"><div class="ln">${S.badges[k]?'🏅':'🔒'}</div><div><b>${BADGES[k].n}</b><div class="small muted">${BADGES[k].d}</div></div></div>`).join('')}</div>
      <div class="note small">13단계 전체 커리큘럼(EPS·PER, ETF, 배당과 복리, 금리, 경기침체, 투자심리, 위험관리 등)은 다음 개발 단계에서 차례로 추가될 예정이에요. 지금은 아래 7개 수업이 실제로 작동해요.</div>`;
  }
  if(!LS.id){
    return LESSONS.map((L,i)=>{ const un=L.unlock(), dn=!!S.lessons[L.id];
      return `<div class="lesson ${dn?'done':''} ${un?'':'locked'}"><div class="ln">${dn?'✓':i+1}</div><div style="flex:1"><b>${L.title}</b><div class="small muted">${dn?'완료! 다시 들으면 그때의 게임 상황으로 문제가 바뀌어요.':un?'지금 들을 수 있어요':'🔒 '+L.lock}</div></div>
        ${un?`<button class="btn ${dn?'sm':'primary'}" data-act="lesson" data-arg="${L.id}">${dn?'다시 듣기':'수업 듣기'}</button>`:''}</div>`; }).join('');
  }
  const L=LESSONS.find(x=>x.id===LS.id), D=LS.data;
  const opts=D.opts.map((o,i)=>{ let cls='opt'; if(LS.done) cls+=o.ok?' ok':(LS.sel.has(i)?' no':''); else if(LS.sel.has(i)) cls+=' sel';
    return `<button class="${cls}" data-act="lopt" data-arg="${i}">${LS.done?(o.ok?'✅ ':(LS.sel.has(i)?'❌ ':'◻️ ')):(LS.sel.has(i)?'☑️ ':'◻️ ')}${esc(o.t)}${LS.done?`<span class="why">${o.why}</span>`:''}</button>`; }).join('');
  let score='';
  if(LS.done){ const right=D.opts.every((o,i)=>o.ok===LS.sel.has(i)); score=right?'<div class="note okbox">🎉 완벽해요! 모든 선택이 맞았어요.</div>':'<div class="note warnbox">조금 아쉬워요. 각 선택지 아래 설명을 읽어 보세요. 틀린 걸 고치는 게 진짜 공부예요.</div>'; }
  return `<button class="btn sm" data-act="lessonBack">← 수업 목록</button>
    <h2 class="jua" style="margin:10px 0">📖 ${L.title}</h2>
    <div class="sec"><h3>① 경험 — 마을에서 있었던 일</h3><div style="line-height:1.7">${D.exp}</div></div>
    <div class="sec"><h3>② 질문 ${D.multi?'<span class="badge">정답 여러 개</span>':'<span class="badge">정답 1개</span>'}</h3><div style="margin-bottom:8px"><b>${D.q}</b></div>${opts}

function validateState(o){
  const errs=[];
  if(!o||typeof o!=='object') return ['저장 데이터가 비어 있어요'];
  if(o.v!==VERSION) errs.push(o.v===3?'이전 버전 저장 파일을 새 버전으로 옮기지 못했어요':o.v===2?'기업 6개 시절(이전 버전)의 저장 파일이에요. 42개 기업·지수·ETF 버전과 시장 구조가 달라서 이어 할 수 없어요. 새 게임을 시작해 주세요.':o.v===1?'원화로 거래하던 이전 버전의 저장 파일이에요. 달러 거래 버전과 계좌 구조가 달라서 이어 할 수 없어요. 새 게임을 시작해 주세요.':`저장 버전이 달라요 (파일 ${o.v}, 게임 ${VERSION})`);
  if(!o.player||typeof o.player.name!=='string') errs.push('플레이어 정보가 없어요');
  if(!o.clock||!(o.clock.day>=1)) errs.push('게임 날짜가 이상해요');
  if(!o.cos) errs.push('회사 정보가 없어요');
  else for(const id of IDS){ const c=o.cos[id]; if(!c||!isFinite(c.price)||c.price<=0||!Array.isArray(c.hist)||!Array.isArray(c.fin)) errs.push(`${id} 회사 데이터가 이상해요`); }
  if(!o.pf||!isFinite(o.pf.krw)||!isFinite(o.pf.usd)) errs.push('계좌 정보가 이상해요');
  if(!isFinite(o.fx)||o.fx<=0||!Array.isArray(o.fxHist)) errs.push('환율 정보가 이상해요');
  if(!o.ix||IX_IDS.some(x=>!o.ix[x]||!o.ix[x].hist||!o.ix[x].hist.length)) errs.push('지수 정보가 이상해요');
  if(!o.etf||ETF_IDS.some(e=>!o.etf[e]||!o.cos||!o.cos[e]||!isFinite(o.cos[e].price))) errs.push('ETF 정보가 이상해요');
  if(!o.dayData||!o.dayData.paths) errs.push('오늘 시장 데이터가 없어요');
  if(!isFinite(o.rng)) errs.push('난수 상태가 없어요');
  if(!o.pres||!isFinite(o.pres.tariff)) errs.push('대통령 정책 정보가 없어요');
  if(!o.home||!Array.isArray(o.home.items)||!o.life||!isFinite(o.life.coins)) errs.push('집·생활 정보가 없어요');
  if(!o.mkt||!REGIMES[o.mkt.reg]||!LEVELS[o.level]) errs.push('시장 국면 정보가 없어요');
  return errs;
}

addEventListener('keydown',e=>{
  Sound.ensure();
  const typing=['INPUT','TEXTAREA'].includes(document.activeElement&&document.activeElement.tagName);
  if(typing){ if(e.code==='Escape') document.activeElement.blur(); if(e.code==='Enter'&&document.activeElement.id==='oQty'){ document.activeElement.blur(); placeFromUI(); }

  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code]=true;
  if(mode!=='play') return;
  if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter') pressE();
  else if(e.code==='Escape'){ if(!$('#dialog').classList.contains('hidden')) advanceDialog(); else if(PANEL.open) closePanel(); else if(!$('#menu').classList.contains('hidden')) closeMenu(); else openMenu(); }
  else if(PANEL.open||!$('#menu').classList.contains('hidden')) return;
  else if(e.code==='KeyM') openMap();
  else if(e.code==='KeyN') openNews('today');
  else if(e.code==='KeyI') openMyPf();
  else if(MP.on&&e.code==='KeyT'){ e.preventDefault(); $('#mpChatIn').focus(); }
  else if(MP.on&&/^Digit[1-9]$/.test(e.code)){ mpEmote(EMOTE_KEYS[Number(e.code.slice(5))-1]); }
  else if(e.code==='KeyP'&&MP.on){ }
  else if(e.code==='KeyP'){ paused=!paused; toast(paused?'⏸ 시간이 멈췄어요 (P로 다시 시작)':'▶ 시간이 다시 흘러요'); uiDirty=true; }

/* ---------- 이 기기에 기억해 두는 것 (복구 토큰 등) ---------- */
function mpStore(){ try{ return JSON.parse(localStorage.getItem(MP_KEY))||{rooms:{}}; }catch(e){ return {rooms:{}}; } }
function mpStoreSet(fn){ const s=mpStore(); s.rooms=s.rooms||{}; fn(s); try{ localStorage.setItem(MP_KEY, JSON.stringify(s)); }catch(e){} return s; }
function mpUrl(){
  let u=(mpStore().server||SERVER_URL||'').trim();
  if(!u){ if(location.protocol==='http:'||location.protocol==='https:') u=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'; else return null; }
  if(/^https?:\/\//.test(u)) u=u.replace(/^http/,'ws');
  if(!/^wss?:\/\//.test(u)) u='wss://'+u;
  if(!/\/ws$/.test(u)) u=u.replace(/\/$/,'')+'/ws';
  return u;
}

/* ---------- 연결 ---------- */
function mpConnect(then){
  const url=mpUrl();
  if(!url){ MP.formMsg='서버 주소를 모르겠어요. 「⚙️ 설정」에서 멀티플레이 서버 주소를 적어 주세요.'; mpRerenderScreen(); return; }
  if(MP.ws && MP.ws.readyState===1){ then&&then(); return; }
  try{ if(MP.ws) MP.ws.close(); }catch(e){}
  MP.connecting=true; mpNetBanner('🔌 서버에 연결하는 중…');
  let ws; try{ ws=new WebSocket(url); }catch(e){ MP.connecting=false; MP.formMsg='서버 주소가 올바르지 않아요: '+url; mpRerenderScreen(); return; }
  MP.ws=ws;
  ws.onopen=()=>{ MP.connecting=false; MP.retry=0; mpNetBanner(null); then&&then(); };
  ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(x){ return; } try{ mpOnMessage(m); }catch(x){ console.error(x); } };
  ws.onclose=()=>{ MP.connecting=false; if(MP.ws!==ws) return;
    if(MP.code && MP.token && (MP.phase==='lobby'||MP.phase==='play')){ mpNetBanner('📴 연결이 끊겼어요. 다시 연결하는 중… (내 계좌는 서버에 안전하게 남아 있어요)'); mpScheduleReconnect(); }
    else if(MP.phase==='connecting'){ MP.formMsg='서버에 연결하지 못했어요. 서버 주소와 인터넷 연결을 확인해 주세요.'; MP.phase='off'; mpRerenderScreen(); mpNetBanner(null); } };
  ws.onerror=()=>{};
}
function mpScheduleReconnect(){
  clearTimeout(MP.reconTimer); const wait=Math.min(10000, 800*Math.pow(1.6, MP.retry++));
  MP.reconTimer=setTimeout(()=>mpConnect(()=>mpSend({t:'player:reconnect', code:MP.code, token:MP.token})), wait);
}
function mpSend(o){ if(MP.ws && MP.ws.readyState===1){ MP.ws.send(JSON.stringify(o)); return true; } return false; }
function mpNetBanner(text){ const el=$('#mpNet'); if(!el) return; if(!text){ el.classList.add('hidden'); return; } el.textContent=text; el.classList.remove('hidden'); }

/* ---------- 서버에서 온 메시지 ---------- */
function mpOnMessage(m){
  switch(m.t){
    case 'hello': return;
    case 'error': mpOnError(m); return;
    case 'room:joined': {
      MP.code=m.code; MP.pid=m.pid; MP.isHost=!!m.isHost; if(m.token) MP.token=m.token;
      MP.privacy=m.privacy||MP.privacy;
      mpStoreSet(s=>{ const r=s.rooms[m.code]||{}; if(m.token) r.token=m.token; r.pid=m.pid; r.lastAt=Date.now(); s.rooms[m.code]=r; s.last=m.code; });
      if(MP.phase==='connecting') MP.phase='lobby';
      return;
    }
    case 'room:state': {
      MP.room=m; MP.isHost=m.hostPid===MP.pid;
      mpStoreSet(s=>{ const r=s.rooms[m.code]; if(r){ r.name=m.settings.name; r.nick=(m.players.find(p=>p.pid===MP.pid)||{}).nick||r.nick; r.day=m.day; } });
      if(m.phase==='lobby'){ MP.phase='lobby'; if(mode!=='lobby') mode='lobby'; mpRenderLobby(); }
      else { if(MP.phase!=='play') MP.phase='play-wait'; }
      mpRenderSide(); return;
    }
    case 'market:snapshot': mpApplySnapshot(m.state, m.reason); return;
    case 'market:update': mpApplyUpdate(m); return;
    case 'me:update': mpApplyMe(m); return;
    case 'market:orderResult': {
      const p=MP.pending.get(m.reqId); MP.pending.delete(m.reqId); mpSavePending();
      if(p&&p.cb) p.cb(m); else if(m.msg) toast((m.ok?'✅ ':'⚠️ ')+m.msg, m.ok?'good':'');
      return;
    }
    case 'day:advance': mpOnDay(m); return;
    case 'shared:state': {
      const prevPred=MP.shared&&MP.shared.pred;
      MP.shared=m; mpRenderSide();
      if(MP.cbPending && m.pred && m.pred.resolved && S && m.pred.cbDay===S.clock.day){ MP.cbPending=false; mpQueueCard({kind:'cb', pred:m.pred}, true); }
      if(PANEL.open && ['mpdebate','mpresearch','mpboard','mphost'].includes(PANEL.def.id)) renderPanel(true);
      if(m.chat && !MP.chatInit){ MP.chatInit=true; $('#mpLog').innerHTML=''; for(const c of m.chat) mpChatLine(c, true); }
      return;
    }
    case 'player:pos': mpOnPos(m.list); return;
    case 'player:pos:fix': if(S&&MP.on){ S.player.x=m.x; S.player.y=m.y; } return;
    case 'player:emote': mpShowEmote(m.pid, m.e); return;
    case 'player:chat': mpChatLine(m); return;
    case 'board': MP.board=m; if(PANEL.open && PANEL.def.id==='mpboard') renderPanel(true); return;
    case 'visit:home': mpOpenVisit(m); return;
    case 'npc:event': toast(m.line,'news'); return;
    case 'economy:event': for(const e of m.events||[]) toast(e.title,'news'); return;
    case 'game:saved': toast('💾 서버에 마을을 저장했어요'); return;
    case 'privacy': MP.privacy=m.privacy; if(PANEL.open&&PANEL.def.id==='mpboard') renderPanel(true); return;
    case 'kicked': { const msg=m.msg; mpStoreSet(s=>{ delete s.rooms[MP.code]; }); mpLeave(true); setTimeout(()=>toast('🚪 '+msg),300); return; }
    case 'room:left': return;
  }
}
function mpOnError(m){
  if(m.reqId){ const p=MP.pending.get(m.reqId); MP.pending.delete(m.reqId); if(p&&p.cb) p.cb({ok:false,msg:m.msg}); return; }
  if(m.code==='bad_token' || (m.code==='no_room' && MP.phase!=='play')){
    if(MP.phase==='play'||MP.phase==='play-wait'||MP.phase==='lobby'){ mpNetBanner(null); }
    MP.phase='off'; MP.code=null; MP.token=null; MP.formMsg=m.msg; clearTimeout(MP.reconTimer);
    if(mode==='play'){ mpLeave(true); setTimeout(()=>toast('⚠️ '+m.msg),300); } else mpRerenderScreen();
    return;
  }
  if(['full','bad_code','bad_nick','rate','no_room','not_ready','started','server'].includes(m.code) && mode!=='play'){ if(MP.phase==='connecting') MP.phase='off'; MP.formMsg=m.msg; mpRerenderScreen(); return; }
  toast('⚠️ '+m.msg);
}

/* ---------- 서버 상태를 내 화면에 반영 ---------- */
function mpApplySnapshot(st, reason){
  const first = !MP.on || mode!=='play' || !S;
  const keep = !first ? {x:S.player.x, y:S.player.y, dir:S.player.dir} : null;
  const prevDay = !first ? S.clock.day : null;
  const prevNews = new Set(!first ? S.news.map(n=>n.id) : []);
  S = st; RNG.s = 1;
  S.settings = Object.assign({speed:1, ui:1, sound:true, psyPop:true}, S.settings||{});
  if(keep && reason!=='join'){ S.player.x=keep.x; S.player.y=keep.y; S.player.dir=keep.dir; }
  MP.coinBase=S.life.coins; MP.lastSig=mpSig();
  const evs=(S.psy&&S.psy.ev)||[], maxId=evs.reduce((a,e)=>Math.max(a,e.id),0);
  if(first){
    MP.on=true; MP.phase='play'; MP.seenPsy=maxId;
    $('#screen').classList.add('hidden'); clearInterval(previewTimer);
    applySettings(); startPlay(); mpShowHud(true);
    MP.lastMove={x:S.player.x,y:S.player.y,moving:false,t:0};
    toast(reason==='start'?`🏡 「${MP.room?MP.room.settings.name:'마을'}」에서 함께하는 투자 생활이 시작됐어요!`:'🔌 마을에 다시 들어왔어요. 서버의 최신 상태를 불러왔어요.','good');
    mpResendPending();
  } else {
    if(S.clock.day!==prevDay){
      const fresh=S.news.filter(n=>!prevNews.has(n.id) && n.day===S.clock.day);
      const big=fresh.filter(n=>n.sev>=2);
      if(fresh.length) toast(`📰 오늘 아침 뉴스 ${fresh.length}건${big.length?' — '+big[0].title:''}`,'news');
      for(const n of fresh) if(n.type==='대통령') queueBroadcast(n.id);
      const F=festNow(); if(F) toast(`${F.e} 오늘은 「${F.name}」! 중앙광장에 무대와 부스가 열렸어요`,'good');
      const rev=S.journal.filter(e=>e.rev && e.rev.day===S.clock.day).length; if(rev) toast(`📔 예전에 쓴 마음 일기 ${rev}건의 결과가 나왔어요`,'news');
    }
    const fresh=evs.filter(e=>e.id>MP.seenPsy);
    if(fresh.length && MP.seenPsy>=0 && S.settings.psyPop!==false){ const top=fresh.slice().sort((a,b)=>b.pr-a.pr)[0]; PSY_Q.q.push(top.id); while(PSY_Q.q.length>2) PSY_Q.q.shift(); }
    MP.seenPsy=Math.max(MP.seenPsy,maxId);
  }
  uiDirty=true; if(PANEL.open) renderPanel(true);
  mpRenderSide();
}
function mpApplyUpdate(m){
  if(!S||!MP.on) return;
  S.clock=m.clock; S.fx=m.fx; const dd=S.dayData; if(dd) dd.k=m.k;
  for(const id in m.px){ const c=co(id), a=m.px[id]; if(!c) continue; c.price=a[0]; c.open=a[1]; c.high=a[2]; c.low=a[3]; c.vol=a[4];
    if(dd && dd.paths && dd.paths[id]) dd.paths[id][m.k]=a[0]; }
  if(dd && dd.fxPath) dd.fxPath[m.k]=m.fx;
  for(const n of m.news||[]){ if(!S.news.some(x=>x.id===n.id)){ S.news.push(n); if(n.type==='대통령') queueBroadcast(n.id); else if(n.sev>=2) toast('📰 '+n.title,'news'); } }
  if(m.k===0) toast('🔔 장이 열렸어요! (09:00)');
  uiDirty=true;
}
function mpApplyMe(m){
  if(!S||!MP.on) return;
  S.pf=m.pf; S.orders=m.orders; S.trades=m.trades; S.quests=m.quests; S.badges=m.badges; S.ids=m.ids;
  S.life.coins=m.life.coins; MP.coinBase=S.life.coins; MP.lastSig=mpSig(); uiDirty=true;
}

/* ---------- 내 기록(학습·집·일기 등)을 서버에 맞춰 두기 — 돈·주식은 여기서 바꿀 수 없어요 ---------- */
function mpSig(){ if(!S) return ''; const L=S.life;
  return JSON.stringify([S.lessons,S.quests,S.badges,S.flags,S.diary,S.settings.sound,S.settings.psyPop,S.settings.ui,S.home,L.coins,L.fr,L.talked,L.gifted,L.gifts,L.fest,(L.festLog||[]).length,L.walkDay,L.walkPaid,(S.journal||[]).map(e=>[e.id,e.note,!!e.shared])]); }
function mpSyncPersonal(){
  if(!MP.on||!S||mode!=='play') return;
  const sig=mpSig(); if(sig===MP.lastSig) return;
  const L=S.life;
  const d={ lessons:S.lessons, quests:S.quests, badges:S.badges, flags:S.flags, diary:S.diary, settings:{sound:S.settings.sound, psyPop:S.settings.psyPop, ui:S.settings.ui}, home:S.home,
    life:{ coinsDelta:L.coins-MP.coinBase, fr:L.fr, talked:L.talked, gifted:L.gifted, gifts:L.gifts, fest:L.fest, festLog:L.festLog, walkDay:L.walkDay, walkDist:L.walkDist, walkPaid:L.walkPaid },
    journal:S.journal };
  if(mpSend({t:'player:patch', d})){ MP.coinBase=L.coins; MP.lastSig=sig; }
}

/* ---------- 주문·환전·취소는 서버로 ---------- */
function mpReq(o, cb){
  const reqId=(MP.pid||'x').slice(0,6)+'-'+Date.now().toString(36)+'-'+(++MP.seq);
  o.reqId=reqId; if(S) o.day=S.clock.day;
  MP.pending.set(reqId,{o,cb,at:Date.now()}); mpSavePending();
  if(!mpSend(o)) toast('📴 연결이 끊겨 있어요. 다시 연결되면 이 주문을 서버에 보낼게요.');
  return reqId;
}
function mpSavePending(){ try{ const arr=[...MP.pending.values()].map(p=>p.o); localStorage.setItem(MP_KEY+'_pending_'+MP.code, JSON.stringify(arr)); }catch(e){} }
function mpResendPending(){
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem(MP_KEY+'_pending_'+MP.code))||[]; }catch(e){}
  for(const o of arr){ if(!MP.pending.has(o.reqId)) MP.pending.set(o.reqId,{o,cb:null,at:Date.now()}); mpSend(o); }   // 같은 주문 번호로 다시 보내면 서버가 중복 체결을 막아 줘요
}

/* ---------- 이동 · 다른 주민 ---------- */
function mpTick(dt){
  if(!MP.on||!S||mode!=='play') return;
  const t=performance.now(), p=S.player, L=MP.lastMove;
  const moved=Math.hypot(p.x-L.x,p.y-L.y);
  if((moved>0.5 || PL.moving!==L.moving) && t-L.t>=100){
    const warp = moved>160 ? 'map' : undefined;
    if(mpSend({t:'player:move', x:p.x, y:p.y, dir:p.dir, moving:!!PL.moving, seq:++MP.moveSeq, warp})) MP.lastMove={x:p.x,y:p.y,moving:PL.moving,t};
  }
  MP.sigT-=dt; if(MP.sigT<=0){ MP.sigT=1.2; mpSyncPersonal(); }
  const fa=MP.room&&MP.room.forceAt; if(fa){ const el=$('#mpForce'); if(el) el.textContent=Math.max(0,Math.ceil((fa-Date.now())/1000))+'초'; }
}
function mpOnPos(list){
  const t=performance.now();
  for(const [pid,x,y,dir,moving,online] of list){
    if(pid===MP.pid) continue;
    let o=MP.others.get(pid); if(!o){ o={buf:[], x, y, dir, moving:false, phase:0}; MP.others.set(pid,o); }
    o.buf.push({t,x,y,dir,moving:!!moving}); if(o.buf.length>12) o.buf.shift(); o.online=!!online;
  }
}
function mpOtherPos(o){
  const rt=performance.now()-120, b=o.buf;                // 0.12초 늦게 그리면서 사이를 부드럽게 채워요
  if(!b.length) return o;
  if(b.length===1||rt<=b[0].t) return b[0];
  for(let i=b.length-1;i>0;i--){ const a=b[i-1], c=b[i]; if(rt>=a.t){ if(rt>=c.t) return c; const k=(rt-a.t)/Math.max(1,c.t-a.t);
    if(Math.hypot(c.x-a.x,c.y-a.y)>300) return c; return {x:a.x+(c.x-a.x)*k, y:a.y+(c.y-a.y)*k, dir:c.dir, moving:c.moving||a.moving}; } }
  return b[b.length-1];
}
function mpPlayerInfo(pid){ return MP.room ? MP.room.players.find(p=>p.pid===pid) : null; }
function mpDrawPlayers(g, list, t){
  if(!MP.on||!MP.room) return;
  for(const [pid,o] of MP.others){
    const info=mpPlayerInfo(pid); if(!info) continue;
    const q=mpOtherPos(o); o.phase+=(q.moving?0.25:0);
    const em=o.emote&&o.emote.until>Date.now()?o.emote.e:null;
    list.push({y:q.y, f:()=>{
      g.save(); if(!info.online) g.globalAlpha=0.45;
      drawAnimal(g,q.x,q.y,{species:info.avatar.species||'hamster',color:spColor(info.avatar.species,info.avatar.color),scarf:info.avatar.scarf,dir:q.dir,moving:q.moving,phase:o.phase,t,emo:em?EMOTE_DEF[em][2]:'happy',wave:em==='wave',bubble:false});
      g.restore(); mpDrawTag(g,q.x,q.y,info,o); }});
  }
  if(S){ const p=S.player; list.push({y:p.y+0.01, f:()=>mpDrawTag(g,p.x,p.y,{nick:MP.room.players.find(x=>x.pid===MP.pid)?.nick||'나', online:true, me:true},MP.me)}); }
}
function mpDrawTag(g,x,y,info,o){
  g.font='11px Jua, sans-serif'; g.textAlign='center';
  const label=(info.host?'👑 ':'')+info.nick+(info.online?'':' (연결 끊김)');
  const w=g.measureText(label).width+12; g.fillStyle=info.me?'rgba(255,236,210,.95)':'rgba(255,255,255,.92)'; rr(g,x-w/2,y-58,w,15,6); g.fill();
  g.fillStyle=info.me?'#c76b2c':'#5a4036'; g.fillText(label,x,y-47);
  const now=Date.now();
  if(o.emote && o.emote.until>now){ const k=1-(o.emote.until-now)/2600; g.font='22px sans-serif'; g.fillText(EMOTE_DEF[o.emote.e][0],x,y-66-Math.sin(Math.min(1,k*3)*Math.PI)*6); }
  if(o.bubble && o.bubble.until>now){ const lines=mpWrap(o.bubble.text,14).slice(0,3); g.font='12px Gowun Dodum, sans-serif';
    const bw=Math.max(...lines.map(l=>g.measureText(l).width))+16, bh=lines.length*15+10, by=y-70-(o.emote&&o.emote.until>now?26:0)-bh;
    g.fillStyle='rgba(255,255,255,.96)'; g.strokeStyle='#d9c3a5'; g.lineWidth=1.5; rr(g,x-bw/2,by,bw,bh,9); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(x-5,by+bh); g.lineTo(x,by+bh+6); g.lineTo(x+5,by+bh); g.fill();
    g.fillStyle='#4a3a30'; lines.forEach((l,i)=>g.fillText(l,x,by+18+i*15)); }
  g.textAlign='left';
}
function mpWrap(s,n){ const out=[]; let cur=''; for(const ch of s){ cur+=ch; if(cur.length>=n){ out.push(cur); cur=''; } } if(cur) out.push(cur); return out; }
function mpShowEmote(pid,e){ const o=pid===MP.pid?MP.me:MP.others.get(pid); if(o) o.emote={e,until:Date.now()+2600}; }
function mpEmote(e){ if(!MP.on) return; mpSend({t:'player:emote', e}); }

/* ---------- 채팅 ---------- */
function mpChatLine(m, quiet){
  const log=$('#mpLog'); if(!log) return;

const RESEARCH_TOPIC_TXT={semi:'💾 반도체 기업 실적',bank:'🏦 은행 부실 위험',rate:'📈 금리와 물가',value:'⚖️ 시장 가치평가'};
function mpResearchData(topic){
  const r20=id=>{ const h=co(id).hist; const k=Math.min(20,h.length-1); return h[h.length-1].c/h[h.length-1-k].c-1; };
  if(topic==='semi'){ const ids=IDS.filter(i=>DEF[i].group==='semi');
    return ids.map(i=>{ const f=co(i).fin[co(i).fin.length-1]; return `${DEF[i].name}: 최근 20일 ${plainPct(r20(i))}${f&&f.expRev?`, 직전 실적 매출 예상 대비 ${plainPct(f.rev/f.expRev-1)}`:''}`; }).join(' / '); }
  if(topic==='bank'){ const ids=IDS.filter(i=>DEF[i].group==='fin'); const bn=S.news.filter(n=>n.day>S.clock.day-20&&(n.type==='금융'||n.groups&&n.groups.includes('fin'))).length;
    return `금융주 20일 평균 ${plainPct(ids.reduce((a,i)=>a+r20(i),0)/ids.length)} · 최근 20일 금융 관련 뉴스 ${bn}건 · 투자 심리 ${(S.eco.sent*100).toFixed(0)}점 · 지정학 위험 ${Math.round(S.eco.geo*100)}`; }
  if(topic==='rate'){ const cb=S.news.filter(n=>n.type==='금리').slice(-3).map(n=>n.title.replace('숲속 중앙은행, ','')).join(' / ');
    return `기준금리 ${S.eco.rate.toFixed(2)}% · 시장의 금리 기대 ${S.eco.rateExp.toFixed(2)}% · 물가 ${S.eco.infl.toFixed(1)}% · 다음 결정 ${dateLabel(S.eco.nextCB)} · 최근 결정: ${cb||'없음'}`; }
  if(topic==='value'){ const vr=typeof mktValuation==='function'?mktValuation():1; const bu=S.rivals&&S.rivals.list.burry.st;
    return `도토리 500 교육용 기초가치 대비 ${plainPct(vr-1)} · 버리굴 과열 경고 ${bu&&bu.warns?bu.warns.length:0}번 · 지수 최근 1년 고점 대비 ${plainPct(idxDD())}`; }
  return '';
}

    <div class="small muted">다른 기기에서 쓰던 계좌로 돌아갈 때 사용해요. 복구 코드는 게임 안 「📊 성적표 → 🔐 내 공개 설정」에서 볼 수 있어요.</div>
    <div><input class="field" id="mpCode" maxlength="8" placeholder="초대 코드 (예: HAM-7K2P)" value="${esc(MPF.code)}" style="text-transform:uppercase"></div>
    <div><input class="field" id="mpRec" maxlength="64" placeholder="복구 코드" value="${esc(MPF.recover)}"></div>
    <div class="note small" style="text-align:left">🔐 복구 정책: 복구 코드는 이 기기에만 저장되고, 서버에는 코드의 「지문(해시)」만 남아요. 그래서 복구 코드를 잃어버리면 방장도 서버도 그 계좌를 되찾아 줄 수 없어요. 자리가 남아 있다면 새 주민으로 다시 입장할 수 있어요.</div>
    ${MP.formMsg?`<div class="omsg down">${esc(MP.formMsg)}</div>`:''}
    <div class="tbtns" style="flex-direction:row;justify-content:center"><button class="btn" data-act="mpMenu">← 뒤로</button><button class="btn primary" data-act="mpRecover">돌아가기</button></div>`;
  mpBindForm();
}
function mpBindForm(){
  const n=$('#mpNick'); if(n) n.oninput=()=>MPF.nick=n.value;
  const c=$('#mpCode'); if(c) c.oninput=()=>{ let v=c.value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.length>3) v=v.slice(0,3)+'-'+v.slice(3,7); c.value=v; MPF.code=v; };
  const r=$('#mpRec'); if(r) r.oninput=()=>MPF.recover=r.value.trim();
  const v=$('#mpVname'); if(v) v.oninput=()=>MPF.settings.name=v.value;
  document.querySelectorAll('[data-mpset]').forEach(sel=>sel.onchange=()=>{ const k=sel.dataset.mpset; let val=sel.value;
    if(k==='startCash') val=Number(val); if(k==='showReturns') val=val==='true'; if(k==='autoSpeed') val=Number(val); MPF.settings[k]=val;
    if(MP.phase==='lobby'&&MP.isHost) mpSend({t:'host:settings', settings:MPF.settings}); });
}
function mpGo(msg){ MP.formMsg=''; MP.phase='connecting'; mpConnect(()=>mpSend(msg)); }
function mpRenderLobby(){
  if(mode==='play') return;
  const R=MP.room; if(!R) return;
  mode='lobby'; MP.screen=mpRenderLobby; $('#screen').classList.remove('hidden');
  const me=R.players.find(p=>p.pid===MP.pid)||{};
  if(MP.isHost) Object.assign(MPF.settings, R.settings);
  const slots=[0,1,2,3].map(i=>R.players[i]);
  const link=location.protocol.startsWith('http')?location.origin+location.pathname+'?room='+R.code:'';
  $('#screenCard').innerHTML=`<div class="jua" style="font-size:1.5em;color:#c76b2c">🏡 ${esc(R.settings.name)} 대기실</div>
    <div style="margin:6px 0">초대 코드 <span class="mpcode">${R.code}</span> <button class="btn sm" data-act="mpCopy" data-arg="${R.code}">복사</button>${link?` <button class="btn sm" data-act="mpCopy" data-arg="${esc(link)}">초대 링크 복사</button>`:''}</div>
    <div class="mpslots">${slots.map((p,i)=>p?`<div class="mpslot ${p.online?'':'off'}"><canvas data-av="${i}" width="90" height="90"></canvas><div><b>${p.host?'👑 ':''}${esc(p.nick)}</b>${p.pid===MP.pid?' (나)':''}</div>
      <div class="small">${p.online?(p.host?'방장':(p.ready?'✅ 준비 완료':'⏳ 준비 중')):'📴 연결 끊김'}</div>
      ${MP.isHost&&p.pid!==MP.pid?`<div><button class="btn sm" data-act="mpTransfer" data-arg="${p.pid}">방장 위임</button> <button class="btn sm" data-act="mpKick" data-arg="${p.pid}">추방</button></div>`:''}</div>`
      :`<div class="mpslot empty"><div style="font-size:2em">🪑</div><div class="small muted">빈자리</div></div>`).join('')}</div>
    <div class="mpform">${MP.isHost?`<label>마을 이름</label><input id="mpVname" maxlength="16" value="${esc(MPF.settings.name)}">
      <label>게임 난이도</label>${mpSel('volatility',['calm','normal','wild'])}<label>경제위기 빈도</label>${mpSel('crisis',['low','normal','high'])}
      <label>시작 투자금</label>${mpSel('startCash',[500000,1000000,3000000,10000000])}<label>시장 진행 방식</label>${mpSel('timeMode',['turn','auto'])}
      <label>경쟁 모드</label>${mpSel('competition',['free','league'])}<label>수익률 공개</label>${mpSel('showReturns',[true,false])}
      <label>대통령 발표</label>${mpSel('presLevel',['quiet','normal','busy'])}<label>시작 위기</label>${mpSel('startScen',['none','gfc','rate','war','bubble'])}`
      :Object.entries({volatility:'게임 난이도',crisis:'경제위기 빈도',startCash:'시작 투자금',timeMode:'시장 진행 방식',competition:'경쟁 모드',showReturns:'수익률 공개',presLevel:'대통령 발표',startScen:'시작 위기'}).map(([k,l])=>`<label>${l}</label><span>${OPT_LABEL[k][R.settings[k]]}</span>`).join('')}</div>
    ${MP.formMsg?`<div class="omsg down">${esc(MP.formMsg)}</div>`:''}
    <div class="tbtns" style="flex-direction:row;justify-content:center;flex-wrap:wrap">
      <button class="btn" data-act="mpLeaveLobby">나가기</button>
      ${MP.isHost?`<button class="btn primary" data-act="mpStart">🚀 게임 시작 (${R.players.filter(p=>p.online).length}명)</button>`:`<button class="btn ${me.ready?'':'primary'}" data-act="mpLobbyReady">${me.ready?'준비 취소':'✅ 준비 완료'}</button>`}</div>
    <div class="small muted">방장이 시작하면 모두 같은 날, 같은 시장에서 출발해요. 게임 도중에 들어와도 자리가 남아 있으면 함께할 수 있어요.</div>`;
  mpBindForm();
  document.querySelectorAll('canvas[data-av]').forEach(cv=>{ const p=slots[Number(cv.dataset.av)]; const g=cv.getContext('2d'); g.clearRect(0,0,90,90); drawAnimal(g,45,84,{species:p.avatar.species||'hamster',color:spColor(p.avatar.species,p.avatar.color),scarf:p.avatar.scarf,scale:2,t:gameT,emo:p.ready||p.host?'happy':'normal',bubble:false}); });
}
function mpLeave(silent){
  clearTimeout(MP.reconTimer);
  const ws=MP.ws; MP.ws=null; MP.phase='off'; try{ if(ws){ ws.onclose=null; ws.close(); } }catch(e){}
  if(MP.on){ MP.on=false; mpShowHud(false); closePanel(); }
  MP.code=null; MP.token=null; MP.room=null; MP.shared=null; MP.others.clear(); MP.cardQ=[]; MP.card=null; MP.chatInit=false; MP.pending.clear();
  $('#mpLog').innerHTML='';
  showTitle();
}
function mpHandleAct(act,arg,el){
  switch(act){
    case 'mpMenu': MP.formMsg=''; mpTitleMenu(); return true;
    case 'mpCreateForm': MP.formMsg=''; mpCreateForm(); return true;
    case 'mpJoinForm': MP.formMsg=''; mpJoinForm(); return true;
    case 'mpRecoverForm': MP.formMsg=''; mpRecoverForm(); return true;
    case 'mpSpecies': MPF.species=arg; mpRerenderScreen(); if(MP.phase==='lobby') mpSend({t:'lobby:profile', avatar:{species:MPF.species, color:MPF.color, scarf:MPF.scarf}}); return true;
    case 'mpFur': MPF.color=arg; mpRerenderScreen(); if(MP.phase==='lobby') mpSend({t:'lobby:profile', avatar:{species:MPF.species, color:MPF.color, scarf:MPF.scarf}}); return true;
    case 'mpScarf': MPF.scarf=arg; mpRerenderScreen(); if(MP.phase==='lobby') mpSend({t:'lobby:profile', avatar:{species:MPF.species, color:MPF.color, scarf:MPF.scarf}}); return true;
    case 'mpCreate': { const nick=(MPF.nick||'').trim(); if(!nick){ MP.formMsg='닉네임을 적어 주세요.'; mpCreateForm(); return true; }
      MP.token=null; mpGo({t:'room:create', nick, avatar:{color:MPF.color, scarf:MPF.scarf}, settings:MPF.settings}); return true; }
    case 'mpJoin': { const nick=(MPF.nick||'').trim(), code=(MPF.code||'').trim().toUpperCase();
      if(!/^[A-Z]{3}-[A-Z0-9]{4}$/.test(code)){ MP.formMsg='초대 코드를 HAM-7K2P 모양으로 적어 주세요.'; mpJoinForm(); return true; }
      if(!nick){ MP.formMsg='닉네임을 적어 주세요.'; mpJoinForm(); return true; }
      const saved=mpStore().rooms[code];
      if(saved&&saved.token){ MP.code=code; MP.token=saved.token; mpGo({t:'player:reconnect', code, token:saved.token}); return true; }   // 이미 이 마을 주민이라면 원래 계좌로
      MP.token=null; mpGo({t:'room:join', code, nick, avatar:{species:MPF.species, color:MPF.color, scarf:MPF.scarf}}); return true; }
    case 'mpRecover': { const code=(MPF.code||'').trim().toUpperCase(), tok=(MPF.recover||'').replace(/\s/g,'');
      if(!code||!tok){ MP.formMsg='초대 코드와 복구 코드를 모두 적어 주세요.'; mpRecoverForm(); return true; }
      MP.code=code; MP.token=tok; mpStoreSet(s=>{ s.rooms[code]=Object.assign(s.rooms[code]||{}, {token:tok, lastAt:Date.now()}); }); mpGo({t:'player:reconnect', code, token:tok}); return true; }
    case 'mpResume': { const r=mpStore().rooms[arg]; if(!r||!r.token) return true; MP.code=arg; MP.token=r.token; mpGo({t:'player:reconnect', code:arg, token:r.token}); return true; }
    case 'mpForget': if(confirm('이 기기에서 이 마을의 복구 정보를 지울까요? 복구 코드를 따로 적어 두지 않았다면 다시 들어갈 수 없어요.')){ mpStoreSet(s=>{ delete s.rooms[arg]; }); mpTitleMenu(); } return true;
    case 'mpLobbyReady': { const me=MP.room.players.find(p=>p.pid===MP.pid); mpSend({t:'lobby:ready', ready:!(me&&me.ready)}); return true; }
    case 'mpStart': { const nr=MP.room.players.filter(p=>p.online&&!p.ready&&!p.host); if(nr.length&&!confirm(`아직 준비하지 않은 주민이 있어요 (${nr.map(p=>p.nick).join(', ')}). 그래도 시작할까요?`)) return true; mpSend({t:'host:start', force:true}); return true; }
    case 'mpLeaveLobby': mpSend({t:'room:leave'}); mpStoreSet(s=>{ if(MP.room&&MP.room.phase==='lobby') delete s.rooms[MP.code]; }); mpLeave(); return true;
    case 'mpCopy': try{ navigator.clipboard.writeText(arg); toast('📋 복사했어요'); }catch(e){ prompt('복사해서 친구에게 보내 주세요', arg); } return true;
    case 'mpKick': { const p=MP.room.players.find(x=>x.pid===arg); if(p&&confirm(`${p.nick} 님을 마을에서 내보낼까요?${MP.room.phase==='play'?' 그 주민의 계좌도 사라져요.':''}`)) mpSend({t:'host:kick', pid:arg}); return true; }
    case 'mpTransfer': { const p=MP.room.players.find(x=>x.pid===arg); if(p&&confirm(`${p.nick} 님에게 방장을 넘길까요?`)) mpSend({t:'host:transfer', pid:arg}); return true; }
    case 'mpReady': { const me=MP.room.players.find(p=>p.pid===MP.pid); mpSyncPersonal(); mpSend({t:'player:ready', ready:!(me&&me.ready)}); return true; }
    case 'mpOpen': mpCloseCard(); mpOpenPanel(arg); return true;
    case 'mpCardClose': mpCloseCard(); return true;
    case 'mpEmote': mpEmote(arg); return true;
    case 'mpChatSend': mpChatSend(); return true;
    case 'mpPredict': mpSend({t:'rate:predict', guess:Number(arg)}); setTimeout(()=>{ if(MP.card&&MP.card.kind==='cbNotice') mpRenderCard(); },300); return true;
    case 'mpDebC': MP.debC=arg; renderPanel(true); return true;
    case 'mpDebSend': if(!MP.debC){ toast('선택지를 먼저 골라 주세요'); return true; } mpSend({t:'debate:answer', id:arg, choice:MP.debC, reason:MP.debR||''}); MP.debC=null; MP.debR=''; return true;
    case 'mpResTopic': MP.resTopic=arg; MP.resData=''; renderPanel(true); return true;
    case 'mpResData': MP.resData=mpResearchData(MP.resTopic); renderPanel(true); return true;
    case 'mpResSend': if(!(MP.resT||'').trim()&&!MP.resData){ toast('조사 내용을 적거나 자료를 모아 주세요'); return true; } mpSend({t:'research:post', topic:MP.resTopic, text:MP.resT||'', data:MP.resData||''}); MP.resT=''; MP.resData=''; toast('🔎 조사판에 올렸어요'); return true;
    case 'mpHost': if(arg==='pause') mpSend({t:'host:pause', paused:!MP.room.paused}); if(arg==='adv') mpSend({t:'host:advance'}); if(arg==='advCancel') mpSend({t:'host:advance', cancel:true}); if(arg==='save') mpSend({t:'game:save'}); setTimeout(()=>renderPanel(true),300); return true;
    case 'mpSet': { const [k,v]=arg.split(':'); const st=Object.assign({},MP.room.settings); st[k]=k==='autoSpeed'?Number(v):k==='showReturns'?v==='true':v; mpSend({t:'host:settings', settings:st}); setTimeout(()=>renderPanel(true),300); return true; }
    case 'mpScen': if(confirm('모든 주민에게 똑같이 위기가 다가오기 시작해요. 시작할까요?')) mpSend({t:'host:scenario', id:arg}); return true;
    case 'mpLeague': if(confirm(`${arg}거래일 투자왕 리그를 시작할까요?`)){ mpSend({t:'league:start', days:Number(arg)}); setTimeout(()=>mpSend({t:'board:get'}),300); } return true;
    case 'mpPriv': { const p=Object.assign({},MP.privacy||{}); p[arg]=el.checked; MP.privacy=p; mpSend({t:'player:privacy', privacy:p}); return true; }
    case 'mpShowToken': { const t=MP.token||''; const s=$('#mpTok'); if(s) s.textContent=t; try{ navigator.clipboard.writeText(t); toast('🔑 복구 코드를 복사했어요. 안전한 곳에 적어 두세요'); }catch(e){} return true; }
    case 'mpVisit': mpSend({t:'player:visit', pid:arg}); return true;
    case 'jShare': { const e=S.journal.find(j=>j.id===Number(arg)); if(e){ e.shared=!e.shared; renderPanel(true); mpSyncPersonal(); } return true; }
    case 'titleSettings': mpTitleSettings(); return true;
    case 'saveServer': { const v=($('#mpSrv').value||'').trim(); mpStoreSet(s=>{ s.server=v; }); toast(v?'서버 주소를 저장했어요':'서버 주소를 비웠어요 (이 페이지를 보낸 서버를 써요)'); mpTitleSettings(); return true; }
    case 'soloMenu': mpSoloMenu(); return true;
    case 'continueMenu': mpContinueMenu(); return true;
  }
  return false;
}
function mpTitleSettings(){
  mode='mpmenu'; MP.screen=mpTitleSettings; const st=mpStore();
  $('#screenCard').innerHTML=`<div class="jua" style="font-size:1.6em;color:#c76b2c">⚙️ 설정</div>
    <div class="sec" style="text-align:left"><h3>🌐 멀티플레이 서버 주소</h3>
      <input id="mpSrv" class="field" style="width:100%" placeholder="비워 두면 이 페이지를 보낸 서버를 사용" value="${esc(st.server||'')}">
      <div class="small muted">예: <span class="num">jusik-maeul.onrender.com</span> · 지금 연결할 주소: ${esc(mpUrl()||'없음')}</div>
      <button class="btn sm primary" data-act="saveServer">저장</button></div>
    <div class="sec" style="text-align:left"><h3>🔊 효과음</h3><div class="small muted">게임 안 「🏡 나의 집 → ⚙️ 설정」에서도 바꿀 수 있어요.</div></div>
    <div class="tbtns"><button class="btn" data-act="backTitle">← 처음으로</button></div>`;
}
function mpSoloMenu(){
  mode='mpmenu'; MP.screen=mpSoloMenu;
  const has=!!localStorage.getItem(SAVE_KEY);
  let info=''; if(has){ try{ const o=JSON.parse(localStorage.getItem(SAVE_KEY)); info=`${esc(o.player.name)} · ${dateLabel(o.clock.day)}`; }catch(e){ info='저장 데이터 확인 필요'; } }
  $('#screenCard').innerHTML=`<div class="jua" style="font-size:1.6em;color:#c76b2c">🐹 혼자 플레이</div>
    <div class="tbtns"><button class="btn primary" data-act="newGame">🌱 새 게임</button>
    <button class="btn" data-act="continue" ${has?'':'disabled'}>📂 이어하기${has?`<div class="small muted">${info}</div>`:''}</button>
    <button class="btn" data-act="importTitle">📥 저장 파일 가져오기</button>
    <button class="btn" data-act="backTitle">← 처음으로</button></div>`;
}
function mpContinueMenu(){
  mode='mpmenu'; MP.screen=mpContinueMenu;
  const has=!!localStorage.getItem(SAVE_KEY);
  let info=''; if(has){ try{ const o=JSON.parse(localStorage.getItem(SAVE_KEY)); info=`${esc(o.player.name)} · ${dateLabel(o.clock.day)}`; }catch(e){} }
  $('#screenCard').innerHTML=`<div class="jua" style="font-size:1.6em;color:#c76b2c">📂 이어하기</div>
    <div class="tbtns"><button class="btn primary" data-act="continue" ${has?'':'disabled'}>🐹 혼자 하던 게임${has?`<div class="small muted">${info}</div>`:'<div class="small muted">저장된 게임 없음</div>'}</button></div>
    ${mpRecentHtml()||'<div class="small muted">이 기기에서 들어갔던 친구 마을이 없어요.</div>'}
    ${MP.formMsg?`<div class="omsg down">${esc(MP.formMsg)}</div>`:''}
    <div class="tbtns"><button class="btn" data-act="mpRecoverForm">♻️ 복구 코드로 돌아가기</button><button class="btn" data-act="backTitle">← 처음으로</button></div>`;
}
/* 중앙광장 대형 화면 — 모두가 함께 겪는 사건이 있는 날 켜져요 */
function mpBigScreen(g,list,t){
  if(!MP.on||!S) return;
  const today=(MP.events||[]).filter(e=>e.day===S.clock.day && e.kind!=='cbNotice');
  const cb=S.news.find(n=>n.type==='금리'&&n.day===S.clock.day);
  if(!today.length&&!cb) return;
  const x=31.5*T, y=16.7*T, W=230, H=96;
  list.push({y, f:()=>{
    g.fillStyle='#5b5f6b'; g.fillRect(x-W/2+16,y-30,6,30); g.fillRect(x+W/2-22,y-30,6,30);
    g.fillStyle='#2f3340'; rr(g,x-W/2,y-30-H,W,H,10); g.fill();
    g.fillStyle='#16304f'; rr(g,x-W/2+8,y-22-H,W-16,H-16,6); g.fill();
    g.fillStyle='#e2574c'; rr(g,x-W/2+14,y-16-H,52,16,4); g.fill(); g.fillStyle='#fff'; g.font='10px Jua, sans-serif'; g.fillText(cb?'● LIVE':'● 속보',x-W/2+22,y-4-H);
    g.fillStyle='#9ff0c0'; g.font='12px Jua, sans-serif';
    const items=(cb?[{title:'🏦 '+cb.title}]:[]).concat(today.filter(e=>e.kind!=='cb'));
    const msg=items.map(e=>e.title).join('   ·   ')+'   ·   ';
    g.save(); g.beginPath(); g.rect(x-W/2+10,y-60-H/2+8,W-20,30); g.clip();
    const tw=g.measureText(msg).width, off=(t*40)%Math.max(1,tw);
    g.fillText(msg,x-W/2+10-off,y-38-H/2+8); g.fillText(msg,x-W/2+10-off+tw,y-38-H/2+8); g.restore();
    g.fillStyle='#fff'; g.font='11px Jua, sans-serif'; g.textAlign='center'; g.fillText('📺 도토리 광장 대형 화면',x,y-34); g.textAlign='left'; }});
}

/* ============================== 30. 시작 ============================== */
resize(); buildWorld(); showTitle(); requestAnimationFrame(frame);
$('#mpEmotes').innerHTML=mpEmoteBar();
{ const q=new URLSearchParams(location.search).get('room'); if(q && /^[A-Za-z]{3}-[A-Za-z0-9]{4}$/.test(q)){ MPF.code=q.toUpperCase(); $('#screen').classList.remove('hidden'); mpJoinForm(); } }
if(document.fonts) document.fonts.ready.then(()=>{ GROUND=buildGround(); });
</script>
